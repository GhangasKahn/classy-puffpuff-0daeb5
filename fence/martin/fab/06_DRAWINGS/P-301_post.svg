<text x='400.0' y='80.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#3d5a4c' text-anchor='start'>DATUM: tenon shoulder = sill top. Measure mortise CL AFF from this shoulder, not from tenon tip.</text>
<text x='400.0' y='120.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>FINISHED LENGTH 67.000"   SETUP S-014 — do not move stop.</text>
<text x='400.0' y='160.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>THROUGH-nuki ONLY: K-001 (2×6), R-001/003/005 (2×10). HOUSE 0.75″: R-002/004/006/007.</text>
<text x='400.0' y='200.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>Foot tenon 2.500 × 4.500  ·  shoulders 0.500 all around  ·  T2 ±0.031</text>
<text x='400.0' y='240.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>L-001: omit kusabi; Latch-B mortise; NO planter.  L-002: oak pivot sockets top+bottom.</text>
<text x='400.0' y='280.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>GRAIN: length vertical. FACE A = garden. END A = shoulder.</text>
<text x='400.0' y='320.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#3d5a4c' text-anchor='start'>Rev E: blank is body + 3.50″ tenon into F-003. Do not through-mortise all seven bands.</text>
