<text x='80.0' y='80.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>Through-nuki + kusabi: K-001 (2×12 PT water table), R-001 and R-002 (2×10 belts).</text>
<text x='80.0' y='110.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>Stations: L-002, L-003, L-004. Withdraw toward P3 for winter. Belts cantilever 3″ past pier faces.</text>
<text x='80.0' y='140.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>Fit: SLIDING then INTERFERENCE via W-001. Do not through-mortise the Q cassettes.</text>
<text x='80.0' y='360.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#3d5a4c' text-anchor='start' font-weight='600'>LAYER SCHEDULE  (z0 → z1  AFF, sill top = 0)</text>
<text x='80.0' y='388.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>K-001   WATER  2x12 PT       11.250"  z 0.000–11.250  CL 5.625  NUKI  water table / dog seal / earth line</text>
<text x='80.0' y='410.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>Q-001   L1     cassette      8.085"  z 12.000–20.085  CL 16.043  CASSETTE  nested-rects light (roots)</text>
<text x='80.0' y='432.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>R-001   BELT1  2x10          9.250"  z 20.835–30.085  CL 25.460  NUKI  projecting Prairie belt</text>
