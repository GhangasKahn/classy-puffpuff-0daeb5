<text x='80.0' y='80.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>Through-nuki + kusabi: K-001 (2×12 PT water table), R-001 and R-002 (2×4 Prairie ribbons).</text>
<text x='80.0' y='110.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>Stations: L-002, L-003, L-004. Withdraw toward P3 for winter. Ribbons cantilever 3″ past pier faces.</text>
<text x='80.0' y='140.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>Fit: SLIDING then INTERFERENCE via W-001. Do not through-mortise the Q cassettes. Do not substitute 2×10.</text>
<text x='80.0' y='360.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#3d5a4c' text-anchor='start' font-weight='600'>LAYER SCHEDULE  (z0 → z1  AFF, sill top = 0)</text>
<text x='80.0' y='388.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>K-001   WATER  2x12 PT       11.250"  z 0.000–11.250  CL 5.625  NUKI  water table / dog seal / earth line</text>
<text x='80.0' y='410.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>Q-001   L1     cassette      11.263"  z 12.000–23.263  CL 17.631  CASSETTE  nested-rects dog grid (¾″ max aperture)</text>
<text x='80.0' y='432.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>R-001   BELT1  2x4           3.500"  z 24.013–27.513  CL 25.763  NUKI  projecting Prairie ribbon</text>
<text x='80.0' y='454.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>Q-002   L2     cassette      18.224"  z 28.263–46.487  CL 37.375  CASSETTE  Tree of Life light (three trees, gold squares)</text>
<text x='80.0' y='476.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>R-002   BELT2  2x4           3.500"  z 47.237–50.737  CL 48.987  NUKI  projecting Prairie ribbon / latch CL</text>
<text x='80.0' y='498.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>Q-003   L3     cassette      11.263"  z 51.487–62.750  CL 57.118  CASSETTE  nested-rects light (foliage / sumac)</text>
<text x='80.0' y='528.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#3d5a4c' text-anchor='start'>Cassette φ pair L2/L1 = 1.618 ≈ φ=1.61803. Stack + eave = 65.000″. Q-001 0.75″ dog grid; upper 1.15″.</text>
