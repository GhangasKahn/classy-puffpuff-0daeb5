<text x='80.0' y='80.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>Through-nuki + kusabi: K-001, R-001, R-003, R-005. Housed 0.75″ dado: R-002, R-004, R-006, R-007.</text>
<text x='80.0' y='110.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>Stations: L-002, L-003, L-004. Withdraw toward P3 for winter. Kick is PT splash / dog seal.</text>
<text x='80.0' y='140.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>Fit: SLIDING then INTERFERENCE via W-001 on nuki. Do not through-mortise housed bands (¾″ web would fail).</text>
<text x='80.0' y='360.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#3d5a4c' text-anchor='start' font-weight='600'>SLAT SCHEDULE  (z0 → z1  AFF, sill top = 0)</text>
<text x='80.0' y='388.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>K-001   KICK   2x6 PT    5.500"  z 0.000–5.500  CL 2.750  NUKI  dog seal / splash nuki</text>
<text x='80.0' y='410.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>R-001   S1     2x10      9.250"  z 5.500–14.750  CL 10.125  NUKI  major Prairie nuki</text>
<text x='80.0' y='432.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>R-002   S2     2x6       5.500"  z 15.500–21.000  CL 18.250  HOUSED  housed screen</text>
<text x='80.0' y='454.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>R-003   S3     2x10      9.250"  z 21.750–31.000  CL 26.375  NUKI  major Prairie nuki / latch CL</text>
<text x='80.0' y='476.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>R-004   S4     2x6       5.500"  z 31.750–37.250  CL 34.500  HOUSED  housed screen</text>
<text x='80.0' y='498.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>R-005   S5     2x10      9.250"  z 38.000–47.250  CL 42.625  NUKI  major Prairie nuki</text>
<text x='80.0' y='520.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>R-006   S6     2x6       5.500"  z 48.000–53.500  CL 50.750  HOUSED  housed screen</text>
<text x='80.0' y='542.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>R-007   S7     2x10      9.250"  z 54.250–63.500  CL 58.875  HOUSED  housed upper band — not nuki (keep post web)</text>
<text x='80.0' y='572.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#3d5a4c' text-anchor='start'>Band ratio 2×10/2×6 = 1.682 ≈ φ=1.61803. Stack + cap = 65.000″. Gaps 0.750″ dog-tight.</text>
