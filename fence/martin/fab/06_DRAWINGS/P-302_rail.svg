<text x='80.0' y='476.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>R-002   BELT2  2x10          9.250"  z 44.666–53.916  CL 49.291  NUKI  projecting Prairie belt / latch CL</text>
