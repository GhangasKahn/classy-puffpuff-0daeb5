<text x='40.0' y='80.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#1a1f24' text-anchor='start'>Tenon thickness ≈ 1/3 of 1.50″ leaf = 0.50″. Cheeks remain ≈ 0.50″.</text>
