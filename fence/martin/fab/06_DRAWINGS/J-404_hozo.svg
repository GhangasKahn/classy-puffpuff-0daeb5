<text x='40.0' y='144.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#1a1f24' text-anchor='start'>W-003 oak pivot ⌀1.25″: bottom socket in sill/threshold at P1; top in cap soffit. Lift-off +Z.</text>
<text x='40.0' y='176.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#1a1f24' text-anchor='start'>Leaf weight in compression to the driveway sill — not a cantilever pintle off P0 (no planter at house).</text>
