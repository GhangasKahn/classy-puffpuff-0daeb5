<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='1680' height='1188' viewBox='0 0 1680 1188'>
<rect x='0.0' y='0.0' width='1680.0' height='1188.0' fill='#f3f1ec' stroke='#1a1f24' stroke-width='3'/>
<rect x='24.0' y='24.0' width='1632.0' height='1140.0' fill='none' stroke='#1a1f24' stroke-width='1'/>
<line x1='24.0' y1='1100.0' x2='1656.0' y2='1100.0' stroke='#1a1f24' stroke-width='1.4'/>
<text x='40.0' y='1132.0' font-family='Georgia, serif' font-size='26' fill='#3d5a4c' text-anchor='start' font-weight='600'>MARTIN</text>
<text x='170.0' y='1130.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#1a1f24' text-anchor='start' font-weight='600'>J-401  ·  Nuki + cassette groove</text>
<text x='40.0' y='1154.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#5a6a4a' text-anchor='start'>Joinery register — see JSON joints[]</text>
<text x='1640.0' y='1132.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#5a6a4a' text-anchor='end'>Rev F.2  ·  inches  ·  kernel 6.2.0</text>
<text x='1640.0' y='1154.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#5a6a4a' text-anchor='end'>PARAMETRIC — do not scale. Datum: sill top / latch face x=0</text>
<text x='40.0' y='80.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#1a1f24' text-anchor='start'>THROUGH-nuki: K-001 (2×12 PT) and R-001/R-002 (2×4 Prairie ribbons). Mortise 1.50″ × 3.50″ through the post.</text>
<text x='40.0' y='112.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#1a1f24' text-anchor='start'>Cheeks: 2.00″ of 5.50″ post each side of 1.50″ ribbon — OK (QA).</text>
<text x='40.0' y='144.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#1a1f24' text-anchor='start'>CASSETTES Q-001/002/003 groove into nuki edges. Do NOT through-mortise — keep the post web.</text>
<text x='40.0' y='176.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#1a1f24' text-anchor='start'>Kusabi W-001 0.625 × 1.125 × 5.500 through cheek slot on nuki posts. NEVER glue.</text>
<text x='40.0' y='208.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#1a1f24' text-anchor='start'>Assembly +X. Winter withdraw cassettes toward P3 after knocking wedges.</text>
<text x='120.0' y='496.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#3d5a4c' text-anchor='start' font-weight='600'>PLAN — 4×6 WEB + 2×4 RIBBON (NOT A 2×10)</text>
<rect x='120.0' y='520.0' width='220.0' height='140.0' fill='#d9dcde' stroke='#1a1f24' stroke-width='2'/>
<rect x='-40.0' y='570.0' width='540.0' height='40.0' fill='#4a4e48' stroke='#1a1f24' stroke-width='2'/>
<rect x='270.0' y='540.0' width='18.0' height='100.0' fill='#3d5a4c' stroke='#1a1f24' stroke-width='1.5'/>
<text x='230.0' y='695.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#5a6a4a' text-anchor='middle'>POST Y = 5.50″</text>
<text x='500.0' y='562.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#5a6a4a' text-anchor='start'>2×4 RIBBON 1.50 × 3.50</text>
<text x='295.0' y='534.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#3d5a4c' text-anchor='start' font-weight='600'>KUSABI</text>
<text x='120.0' y='730.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>NEVER GLUE locking faces. Sliding fit, then wedge. Withdraw +X toward P3.</text>
<text x='120.0' y='758.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>Cassettes sit in 0.375″ grooves in the ribbon edges — they do not punch the post web.</text>
</svg>
