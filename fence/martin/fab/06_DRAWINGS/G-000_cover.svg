<text x='40.0' y='70.0' font-family='Georgia, serif' font-size='22' fill='#3d5a4c' text-anchor='start' font-weight='600'>MARTIN — DIGITAL MANUFACTURING DEFINITION</text>
<text x='40.0' y='100.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#5a6a4a' text-anchor='start'>Prairie removable fence  ·  143″ × 65″  ·  Darwin Martin + Japanese joinery  ·  wood + light + latch</text>
<text x='40.0' y='140.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>WHAT  Freestanding winter-removable Prairie screen + locking gate against the house</text>
<text x='40.0' y='168.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>FROM  Dimensional lumber + live planters (stone in-box only) — NO concrete, NO post holes, NO pad</text>
<text x='40.0' y='196.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>SIZE  overall_length=143.000  overall_height=65.000  gate_clear=36.000 (ASSUMED)  drop_off=0 (slab)</text>
<text x='40.0' y='224.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>FACE  Horizontal 2×10 / 2×6 bands, ¾″ dog-tight gaps, PT kick nuki, φ-adjacent 9.25/5.5=1.682</text>
<text x='40.0' y='252.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>QTY   One run; part quantities in S-601</text>
<text x='40.0' y='280.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>CONNECT  nuki+kusabi (4 bands), housed dado (4 bands), hozo drawbore, oak pivots, sill laps</text>
<text x='40.0' y='308.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>MAKE  See routings + AS-01..12  ·  MEASURE from sill-shoulder datum</text>
<text x='40.0' y='336.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>ASSEMBLE  Base → posts → bands → cap/light → gate on oak pivots → plant troughs (not at house)</text>
<text x='40.0' y='364.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>CHECK  QA-701  ·  CHANGE  edit kernel P[] then re-export</text>
