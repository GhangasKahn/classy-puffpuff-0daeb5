<text x='40.0' y='252.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>CONNECT  nuki+kusabi, hozo drawbore, foot tenon into F-003, floating grooves, sill laps</text>
<text x='40.0' y='280.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>MAKE  See routings + AS-01..12  ·  MEASURE from sill-shoulder datum</text>
