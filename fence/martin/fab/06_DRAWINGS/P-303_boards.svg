<text x='40.0' y='1132.0' font-family='Georgia, serif' font-size='26' fill='#3d5a4c' text-anchor='start' font-weight='600'>MARTIN</text>
<text x='170.0' y='1130.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#1a1f24' text-anchor='start' font-weight='600'>P-303  ·  Tree of Life + nested-rect cassettes</text>
<text x='40.0' y='1154.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#5a6a4a' text-anchor='start'>Darwin Martin light-screen  ·  Q-001 0.75″ dog grid</text>
<text x='1640.0' y='1132.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#5a6a4a' text-anchor='end'>Rev F.2  ·  inches  ·  kernel 6.2.0</text>
<text x='1640.0' y='1154.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#5a6a4a' text-anchor='end'>PARAMETRIC — do not scale. Datum: sill top / latch face x=0</text>
<text x='40.0' y='80.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>Bay clear 46.500"  ·  two privacy bays  ·  gate against house (no planter at P0)</text>
<text x='40.0' y='112.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>Q-001 nested-rects (roots)  ·  Q-002 Tree of Life — three trees  ·  Q-003 nested-rects (foliage)</text>
<text x='40.0' y='144.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#3d5a4c' text-anchor='start'>Original wood muntin interpretation of Darwin Martin House art glass — not a licensed reproduction.</text>
<text x='40.0' y='176.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#3d5a4c' text-anchor='start'>DOG SEAL: PT 2×12 water table K-001 at z=0; Q-001 0.75″ grid; upper lights 1.15″; gate bottom 0.375″.</text>
<text x='40.0' y='208.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>T-001 qty 36  1.50 × 1.50 × 7.00″  2×2 Roman-brick wrap on P1/P2/P3. Ornament — not structure.</text>
<text x='40.0' y='250.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#5a6a4a' text-anchor='start'>Cassettes recess behind the belt courses. Winter-withdraw toward P3. Do not caulk the lights.</text>
