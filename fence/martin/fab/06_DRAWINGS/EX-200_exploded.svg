<text x='40.0' y='326.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#1a1f24' text-anchor='start'>7  A-030 gate +Z onto L-002 pintles; G-010 slides into L-001 (Latch B)</text>
