<text x='40.0' y='627.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>•  Optional: stainless pintle backup, keyed padlock hasp. Allowed metal: lighting + latch.</text>
<text x='40.0' y='651.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>•  NO concrete. NO gravel bed. NO post-hole digger. NO epoxy into the house. NO planter at the gate.</text>
<text x='40.0' y='980.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#5a6a4a' text-anchor='start'>CUT ORDER: sills/ties → posts → nuki + cassette grooves → belts/water table → Tree of Life cassettes → eave scarf → gate → paint → set → plant.</text>
