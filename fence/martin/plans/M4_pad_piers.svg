<text x='800.0' y='346.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>SILLS 155" × 4×6  ·  BASE 39.5" WIDE  ·  DROP 0" (0 = slab)</text>
<text x='780.0' y='420.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#3d5a4c' text-anchor='start' font-weight='600'>WINTER REMOVAL SEQUENCE</text>
<text x='780.0' y='455.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>1. Open gate · remove oak latch peg / padlock.</text>
<text x='780.0' y='479.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>2. Knock out rail wedges (kusabi) — save in labeled bag.</text>
<text x='780.0' y='503.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>3. Slide nuki bands out of posts (two-person).</text>
<text x='780.0' y='527.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>4. Withdraw light cassettes toward P3.</text>
<text x='780.0' y='551.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>5. Lift gate leaf off oak pivots (W-003).</text>
<text x='780.0' y='575.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>6. Lift each post straight up out of F-003.</text>
<text x='780.0' y='599.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>7. Empty planters (or lift troughs); store dry. Lift ladder or leave sills.</text>
<text x='780.0' y='623.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>8. Nothing is poured. Nothing is buried. No post holes. No pad.</text>
<text x='40.0' y='780.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#3d5a4c' text-anchor='start' font-weight='600'>NOTES</text>
<text x='40.0' y='808.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>• Entirely freestanding furniture fence. NO post holes. NO cement. NO gravel or stone pads.</text>
<text x='40.0' y='832.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>• Run sits on the driveway slab (photos). F-004 packing only if outriggers leave the slab.</text>
<text x='40.0' y='856.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>• H-001 rubber furniture pads under F-001 protect the driveway — no fasteners into pavement.</text>
<text x='40.0' y='880.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>• Wind ballast: two live planters (P1–P2, P2–P3). Optional stone IN the boxes. Not a pad.</text>
<text x='40.0' y='904.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>• Latch B default (mortise in P0). Gate against the house. Do not epoxy. No planter at P0.</text>
</svg>
