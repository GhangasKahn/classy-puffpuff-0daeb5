<text x='40.0' y='430.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>FIT CLASSES USED: SLIDING (nuki width) · CLEARANCE (foot tenon) · DRAWBORED (hozo/kama) · FLOATING (boards) · SNUG (brace lap)</text>
<text x='40.0' y='460.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>FAILURE MODES: cupping if pith in nuki; locked mortise if ease omitted; winter bind if sleeve clearance lost; racking if brace omitted.</text>
<text x='40.0' y='500.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#5a6a4a' text-anchor='start'>STRUCTURAL NOTE: Planning design — not a stamped PE document. Wind path: nuki compression + pier mass. No nail withdrawal.</text>
