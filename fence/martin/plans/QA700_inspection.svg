<text x='980.0' y='288.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#5a6a4a' text-anchor='start'>Straight-up winter removal; 36″ clear arc</text>
<text x='40.0' y='310.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>QC-09</text>
