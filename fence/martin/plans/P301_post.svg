<text x='420.0' y='70.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#3d5a4c' text-anchor='start' font-weight='600'>HANDED / UNIQUE</text>
<text x='420.0' y='100.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>•  L-001 P0 Latch — nuki mortises; NO kusabi slots; Latch B mortise optional.</text>
<text x='420.0' y='124.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>•  L-002 P1 Hinge — nuki + kusabi; wooden pintle gudgeons on gate side.</text>
<text x='420.0' y='148.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>•  L-003 P2 Mid — nuki + kusabi; bears kama-tsugi.</text>
<text x='420.0' y='172.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>•  L-004 P3 End — nuki + kusabi; run terminus.</text>
<text x='420.0' y='196.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>•  Mortise: width = measured rail_t (sliding). Height = 7.25 + 1/16 ease.</text>
<text x='420.0' y='220.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>•  Cheeks ~1″ each side of rail (post_y − rail_t)/2.</text>
<text x='420.0' y='244.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>•  OP040: one MFT stop for all four rough/finish lengths. DO NOT MOVE.</text>
<text x='420.0' y='268.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>•  Grain: more vertical grain on 5.5″ exposed faces. No pith in tenon.</text>
<text x='420.0' y='360.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#3d5a4c' text-anchor='start' font-weight='600'>QTY 4  ·  MAKE  ·  DF Select  ·  Purchase 6×6×8′</text>
