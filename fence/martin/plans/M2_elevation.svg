<text x='980.0' y='430.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#3d5a4c' text-anchor='start' font-weight='600'>JOINERY RULE (STRENGTH)</text>
<text x='980.0' y='465.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>•  Through-nuki + kusabi: K-001, R-001, R-003, R-005 only.</text>
<text x='980.0' y='491.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>•  Housed 0.75″ dado: remaining bands — keep the post web.</text>
<text x='980.0' y='517.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>•  Do not rip 2×10 to force φ. 9.25/5.5 = 1.682 ≈ φ.</text>
<text x='980.0' y='543.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>•  ¾″ gaps + PT kick = dog seal. Do not caulk the light-screen.</text>
<text x='980.0' y='569.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>•  Cap scarf (kama-tsugi) on P2, drawbored. IP65 tape in soffit.</text>
<text x='980.0' y='595.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>•  Never glue locking faces. Paint after dry-fit; mask joinery.</text>
