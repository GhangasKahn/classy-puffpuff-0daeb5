<text x='620.0' y='70.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#3d5a4c' text-anchor='start' font-weight='600'>HARDWARE (WOOD-FIRST)</text>
<text x='620.0' y='100.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>HINGE: 1.25" oak pivots W-003 (structurally best on a freestanding P1).</text>
<text x='620.0' y='122.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>  — Bottom socket in the sill/threshold at P1; top in the cap soffit.</text>
<text x='620.0' y='144.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>  — Leaf weight in compression to the driveway — not a cantilever pintle.</text>
<text x='620.0' y='166.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>  — Gate lifts straight up (+Z) for winter. Optional stainless pintle is backup only.</text>
<text x='620.0' y='188.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>LATCH B — DEFAULT (fully freestanding, against the house):</text>
<text x='620.0' y='210.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>  — 1.5" × 3.5" × 18" sliding oak bar through latch stile.</text>
<text x='620.0' y='232.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>  — Bar enters mortise in P0 latch post; gravity catch.</text>
<text x='620.0' y='254.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>  — Cross-peg + optional keyed padlock hasp on bar.</text>
<text x='620.0' y='276.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>  — NO epoxy, NO house receiver, NO planter at P0.</text>
<text x='620.0' y='298.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>LATCH A — OPTIONAL ONLY (if you later choose a house strike):</text>
<text x='620.0' y='320.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>  — Oak strike block on the wall you own — not in this default kit.</text>
<text x='620.0' y='342.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>SWING: Into garden (confirm site). Clear arc 36".</text>
<text x='620.0' y='364.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>JOINERY: Drawbored mortise &amp; tenon at every stile/rail (hozo).</text>
<text x='620.0' y='386.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>  Diagonal brace half-lapped into rails — no fasteners.</text>
<text x='620.0' y='408.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>INFILL: Horizontal bands match the Prairie screen — ¾" dog gaps.</text>
<text x='40.0' y='980.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#5a6a4a' text-anchor='start'>PRIVACY: Gate infill matches the Prairie band rhythm. Bottom clear 0.375" (dog). Top clear 0.50" under cap.</text>
