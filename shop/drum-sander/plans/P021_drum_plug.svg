<text x='90.0' y='638.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#3d4a38' text-anchor='start' font-weight='600'>Isometric plug</text>
<text x='640.0' y='620.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>SHOP NOTES</text>
<text x='640.0' y='640.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Concentricity of bore to OD becomes drum TIR directly. One</text>
<text x='640.0' y='656.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  setup, two operations.</text>
<text x='640.0' y='676.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Light push fit on the 1.25" shaft — no rock. Clamp collars</text>
<text x='640.0' y='692.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  H-029 locate axially (J-106).</text>
<text x='640.0' y='712.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Cross-pin through the shell wall in two places 90° apart after</text>
<text x='640.0' y='728.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  the epoxy cures. Pins carry torque.</text>
<text x='640.0' y='748.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Make a spare from the same bar. 3D-print is not a substitute</text>
<text x='640.0' y='764.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  for this part.</text>
