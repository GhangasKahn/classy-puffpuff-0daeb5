<text x='36.0' y='720.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>WHY THIS PAGE EXISTS</text>
<text x='36.0' y='744.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#2a2a2a' text-anchor='start'>• PLANFORGE forbids patching only the visible drawing. Everything listed here is regenerated from cad/walter_ds16.py.</text>
<text x='36.0' y='768.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#2a2a2a' text-anchor='start'>• CALC-C01 is a RESOLVED finding about Rev B, not an open defect. It is kept because deleting it would hide why the axis was redesigned.</text>
<text x='36.0' y='792.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#2a2a2a' text-anchor='start'>• Machine envelope is unchanged: 15.5″ capacity, 16.5″ inner span, no conveyor, vertical captured ways, stretcher triangle.</text>
<text x='36.0' y='816.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#2a2a2a' text-anchor='start'>• Option B (MDF disc stack) is documented so a shop without a lathe can still build. It is not the accuracy baseline.</text>
