<text x='80.0' y='948.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Groove the outboard face 0.24" deep × 2.516" wide.</text>
<text x='80.0' y='968.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Tongue is 0.23" × 2.5". X play 0.01", Y play 0.016"</text>
<text x='80.0' y='984.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  (CALC-005).</text>
<text x='80.0' y='1004.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Bolt under the table edge, centered on drum CL. Table moves in</text>
