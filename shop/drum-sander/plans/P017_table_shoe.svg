<text x='200.0' y='70.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#3d4a38' text-anchor='start'>Groove 0.240″ deep × 2.516″ wide captures the 0.230″ × 2.5″ tongue. Table moves in Z only.</text>
