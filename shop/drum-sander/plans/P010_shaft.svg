<text x='820.0' y='500.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>SHOP NOTES</text>
<text x='820.0' y='520.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Do not lock both flanges. Drive is the datum; idler must let</text>
<text x='820.0' y='536.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  the shaft grow.</text>
<text x='820.0' y='556.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Key slots: ⅛″ piano wire, snug in the discs, not a press that</text>
<text x='820.0' y='572.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  bananas the pack.</text>
<text x='820.0' y='592.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• After truing: TIR ≤ 0.002″ mid-span paper-off (QC-06), then</text>
<text x='820.0' y='608.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  wrap, then re-clock |A−B|.</text>
