<text x='80.0' y='480.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>CALC-C01 Rev B ¾″ shaft @ 20 lbf</text>
<text x='500.0' y='480.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>4.70 mil crown</text>
<text x='860.0' y='480.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>FAIL — 4.25 lbf uses the 1 mil allowance</text>
<text x='80.0' y='508.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>CALC-C02 Rev C series model @ 20 lbf</text>
<text x='500.0' y='508.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>0.223 mil crown</text>
<text x='860.0' y='508.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>shaft share 96%</text>
<text x='80.0' y='536.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>CALC-C03 allowable force for 1 mil</text>
<text x='500.0' y='536.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>89.6 lbf</text>
<text x='860.0' y='536.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>4× the 20 lbf reference</text>
<text x='80.0' y='564.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>I_shell / I_shaft</text>
<text x='500.0' y='564.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>10.55 / 0.1198 in⁴</text>
<text x='860.0' y='564.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>Wall is a stiffness requirement</text>
<text x='80.0' y='640.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>SHOP NOTES</text>
<text x='80.0' y='660.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• The Rev B shaft is a simply-supported beam with the sanding</text>
<text x='80.0' y='676.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  load on the bare ¾″ section. It is not a bonded composite with</text>
<text x='80.0' y='692.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  the MDF discs — those do not take bending.</text>
<text x='80.0' y='712.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Rev C puts a structural tube between the plugs. The shaft</text>
<text x='80.0' y='728.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  still carries the overhangs to the bearings. Series, not</text>
<text x='80.0' y='744.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  parallel.</text>
<text x='80.0' y='764.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Force_reference 20 lbf is ESTIMATED. Report the allowable</text>
<text x='80.0' y='780.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  force so a builder can work backwards from a test.</text>
<text x='80.0' y='800.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Critical speed and unbalance: see CALC-C13 / CALC-C16 in the</text>
<text x='80.0' y='816.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  JSON dump. Operating ~20 Hz; conservative first mode well</text>
<text x='80.0' y='832.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  above.</text>
