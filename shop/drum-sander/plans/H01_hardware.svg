<text x='170.0' y='150.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>4-bolt flange bearings, ¾″ bore, sealed. Need 2.</text>
<text x='170.0' y='166.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>Drive FIXED, idler on axial pad.</text>
<text x='170.0' y='270.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>H-007</text>
<text x='170.0' y='290.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>½-10 Acme × 12″ + bronze nut + flange. Need 2.</text>
<text x='170.0' y='390.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>H-013</text>
<text x='170.0' y='410.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>Star knobs ⅜-16 + 1½″ studs. Need 6. Way locks</text>
<text x='170.0' y='426.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>and yokes.</text>
<text x='170.0' y='520.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>H-014 / H-015</text>
<text x='170.0' y='540.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>#8 × 1¼″ (need 100) and #8 × 2″ (need 50) coarse</text>
<text x='170.0' y='556.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>cabinet screws.</text>
<text x='170.0' y='660.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>H-021</text>
<text x='170.0' y='680.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>Dial indicator 0.001″ + mag base. Or a caliper</text>
<text x='170.0' y='696.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>in wooden blocks.</text>
<text x='170.0' y='800.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>H-009</text>
<text x='170.0' y='820.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>Rubber rollers ⌀1.25" × ~15.75". Need 2.</text>
<text x='1020.0' y='130.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>H-003 / H-004</text>
<text x='1020.0' y='150.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>3.00" motor and 5.00" drum 4L pulleys.</text>
<text x='1020.0' y='270.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>H-006</text>
<text x='1020.0' y='290.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>0.5 HP 1725 RPM TEFC, 115 V. Code the wiring.</text>
<text x='1020.0' y='390.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>H-017</text>
<text x='1020.0' y='410.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>5/16-18 × 1″ hex + nylock + washer. Need 8.</text>
<text x='1020.0' y='426.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>Confirm flange hole.</text>
<text x='1020.0' y='520.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>H-016</text>
<text x='1020.0' y='540.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>¼-20 T-nuts + 1¼″ bolts. Need 8. Motor cradle.</text>
<text x='1020.0' y='660.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>H-018</text>
<text x='1020.0' y='680.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>⅛″ piano wire, 12″. Disc keys — must fit</text>
<text x='1020.0' y='696.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>tightly.</text>
<text x='1020.0' y='800.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>H-022</text>
<text x='1020.0' y='820.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>Hook Velcro 4″ PSA + 3″ loop paper</text>
<text x='1020.0' y='836.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>80/120/180/220.</text>
<text x='80.0' y='1048.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d4a38' text-anchor='start'>Also: H-005 belt (size after cradle lock) · H-008 #25 chain + left clutch/dog · H-011 springs · H-012 shoulder bolts · H-019 4″ port · H-020 switch/cord · H-023 Titebond III · H-024 paste wax · H-025 optional osc motor.</text>
