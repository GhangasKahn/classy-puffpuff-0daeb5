<text x='1080.0' y='796.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  CL, flange bolts, and stretcher pilots. Then split.</text>
<text x='1080.0' y='816.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Dados J-001 and way rebate J-002 are INNER FACE only and</text>
<text x='1080.0' y='832.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  mirrored. Do not dado the pair while stacked.</text>
<text x='1080.0' y='852.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Way rebate 0.52" deep × 0.75" wide so P-007 projects 0.23".</text>
<text x='1080.0' y='868.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  Without the rebate a 16" table will not enter the 16.5" span.</text>
<text x='1080.0' y='888.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Clamp each stretcher in its housing, then drill #8 pilots</text>
<text x='1080.0' y='904.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  through the side into P-003 (S-006). Countersink from the</text>
<text x='1080.0' y='920.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  outside.</text>
<text x='1080.0' y='940.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• H-002 floats on a 0.25″ UHMW pad (J-007). Do not elongate the</text>
<text x='1080.0' y='956.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  flange holes in the YZ plane — that lets the drum axis wander.</text>
<text x='1080.0' y='972.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  Bolts snug, not torqued; shaft must be able to grow axially.</text>
<text x='1080.0' y='992.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Do not copy the motor pivot or A-clock pad onto this panel.</text>
</svg>
