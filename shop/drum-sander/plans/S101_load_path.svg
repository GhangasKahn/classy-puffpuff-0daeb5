<text x='46.0' y='168.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#3d4a38' text-anchor='start' font-weight='600'>Down through the nuts, out through the triangle, into the base</text>
<text x='860.0' y='160.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>LOAD PATH</text>
<text x='860.0' y='184.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Cut force: drum → workpiece → table wear face → torsion box →</text>
<text x='860.0' y='200.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  P-016 nuts → Acme screws in tension → P-018 thrust on the</text>
<text x='860.0' y='216.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  base.</text>
<text x='860.0' y='238.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Feed force: workpiece → hold-downs / table → P-017 shoes →</text>
<text x='860.0' y='254.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  vertical ways → sides → IN-LO / OUT-LO / OUT-HI triangle.</text>
<text x='860.0' y='276.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Drum mass and KE: bearings → sides. Drive side FIXED. Idler</text>
<text x='860.0' y='292.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  FLOATING so the shaft is not a column in bending.</text>
<text x='860.0' y='314.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• CALC-006 table sag bound under 50 lbf: see G-003. CALC-007</text>
<text x='860.0' y='330.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  drum KE is estimated ~54 ft·lbf estimated.</text>
<text x='860.0' y='352.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Base sits on a bench or stand [A]. No foundation design is</text>
<text x='860.0' y='368.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  released. If you bolt this to a floor, that connection is [P].</text>
<text x='860.0' y='390.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Side panels are ¾″ Baltic birch, not posts. Do not treat</text>
<text x='860.0' y='406.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  housing depth as a timber mortise. J-001 is a plywood dado.</text>
<text x='36.0' y='660.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#a8342a' text-anchor='start' font-weight='600'>LIMITATIONS</text>
<text x='36.0' y='684.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• This is a woodshop machine, not a building. Interaction ratios and seismic coefficients do not apply.</text>
<text x='36.0' y='704.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Motor mass on P-012 is gravity-hung then locked. Do not treat the pivot as a live hinge in service.</text>
<text x='36.0' y='724.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Do not exceed 1 HP / 1725 RPM as drawn. A larger motor is a different machine and a different KE.</text>
<text x='36.0' y='744.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Electrical, switch, and grounding: [P] qualified person. Not released.</text>
</svg>
