<text x='992.0' y='270.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>Titebond III + thin CA</text>
<text x='1352.0' y='270.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d4a38' text-anchor='start' font-weight='600'>x1</text>
<text x='912.0' y='299.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='11' fill='#3d4a38' text-anchor='start'>TOOLS: Bandsaw · Drill press + reamer · Clamps · Scale</text>
<text x='912.0' y='315.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='11' fill='#3d5a4c' text-anchor='start'>OPEN THESE SHEETS: P-008 · P-009 · P-015 · A-02</text>
<rect x='900.0' y='337.0' width='720.0' height='30.0' fill='#5f8f62' stroke='#1a1a1a' stroke-width='1.2'/>
<text x='912.0' y='358.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#ffffff' text-anchor='start' font-weight='600'>BEFORE YOU MOVE ON   (QC-06 · QC-18)</text>
<text x='912.0' y='389.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#1a1a1a' text-anchor='start'>Bore accepts the shaft with light friction. Stack length</text>
<text x='912.0' y='407.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#1a1a1a' text-anchor='start'>15.75″.</text>
<text x='912.0' y='431.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>HOLD POINT: Full cure before the drum ever spins. A</text>
<text x='912.0' y='448.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d5a4c' text-anchor='start'>delaminated disc at speed is a projectile.</text>
<text x='912.0' y='471.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d4a38' text-anchor='start'>Still correctable after this step: Outside diameter — that is</text>
<text x='912.0' y='488.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d4a38' text-anchor='start'>what truing is for.</text>
<rect x='900.0' y='511.0' width='720.0' height='98.0' fill='#f6e7e4' stroke='#a8342a' stroke-width='1.4'/>
<text x='914.0' y='531.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#a8342a' text-anchor='start' font-weight='600'>⚠ ACCEPT THE PENALTY KNOWINGLY: a disc stack is not structural</text>
<text x='914.0' y='549.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#a8342a' text-anchor='start'>   in bending, so the drum crowns under load and MDF moves with</text>
<text x='914.0' y='567.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#a8342a' text-anchor='start'>   humidity, so TIR drifts between seasons. Expect to re-true</text>
<text x='914.0' y='585.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#a8342a' text-anchor='start'>   more often and to hold a looser TV-01 than 0.005″.</text>
</svg>
