<text x='40.0' y='1130.0' font-family='Georgia, serif' font-size='28' fill='#3d5a4c' text-anchor='start' font-weight='600'>WALTER</text>
<text x='170.0' y='1126.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='18' fill='#1a1f24' text-anchor='start' font-weight='600'>D-12  ·  Joinery, routing, QA</text>
<text x='40.0' y='1154.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#5a6a4a' text-anchor='start'>J-IDs · stop setups · inspection gates</text>
<text x='1640.0' y='1130.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#5a6a4a' text-anchor='end'>DS-16 · Dedicated drum thickness sander</text>
<text x='1640.0' y='1154.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#5a6a4a' text-anchor='end'>ShopNotes 86 → Walters → Rev B geometry · fab B.2 (individual part sheets)</text>
<text x='40.0' y='70.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#3d5a4c' text-anchor='start' font-weight='600'>JOINT REGISTER</text>
<text x='40.0' y='98.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>J-001</text>
<text x='110.0' y='98.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>housed dado + screw  P-001L / P-001R → P-003</text>
<text x='980.0' y='98.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5a6a4a' text-anchor='start'>Racking stiffness. Ways, not stretchers, locate the table.</text>
<text x='40.0' y='115.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>J-002</text>
<text x='110.0' y='115.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>rebate + bond  P-001L / P-001R → P-007</text>
<text x='980.0' y='115.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5a6a4a' text-anchor='start'>Without the rebate a ¾″ way would steal 1.5″ and the 16″ table would n</text>
<text x='40.0' y='132.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>J-003</text>
<text x='110.0' y='132.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>glue torsion box  P-004 → P-005</text>
<text x='980.0' y='132.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5a6a4a' text-anchor='start'>Continuous glue. Flatten before J-004.</text>
<text x='40.0' y='149.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>J-004</text>
<text x='110.0' y='149.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>bonded wear face  P-004 → P-006</text>
<text x='980.0' y='149.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5a6a4a' text-anchor='start'>Replaceable metrology surface.</text>
<text x='40.0' y='166.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>J-005</text>
<text x='110.0' y='166.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>pack-bore + keyed stac  P-008 / P-009 → P-010</text>
<text x='980.0' y='166.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5a6a4a' text-anchor='start'>Bore as a pack. 1 mm relief every 4 MDF discs. Balance ends.</text>
<text x='40.0' y='183.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>J-006</text>
<text x='110.0' y='183.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>flange bearing, fixed  P-001L → H-001 / P-010</text>
<text x='980.0' y='183.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5a6a4a' text-anchor='start'>Drive-side axial lock. Datum for drum axis.</text>
<text x='40.0' y='200.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>J-007</text>
<text x='110.0' y='200.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>flange bearing, floati  P-001R → H-002 / P-010</text>
<text x='980.0' y='200.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5a6a4a' text-anchor='start'>0.25″ UHMW pad under the flange. Bolts snug, not torqued. Do not slot </text>
<text x='40.0' y='217.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>J-008</text>
<text x='110.0' y='217.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>pivoting T-nut cradle  P-012 → H-016 / P-001L</text>
<text x='980.0' y='217.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5a6a4a' text-anchor='start'>Gravity tension, then lock so the belt cannot pump.</text>
<text x='40.0' y='234.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>J-009</text>
<text x='110.0' y='234.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>spring yoke pivot  P-014 → H-009 / H-011 / H-012</text>
<text x='980.0' y='234.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5a6a4a' text-anchor='start'>Set rollers 0.030″ below drum OD, paper on.</text>
<text x='40.0' y='251.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>J-010</text>
<text x='110.0' y='251.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>screw base to sides  P-002 → P-001L / P-001R</text>
<text x='980.0' y='251.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5a6a4a' text-anchor='start'>GLUE + SCREW</text>
<text x='40.0' y='268.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>J-011</text>
<text x='110.0' y='268.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>bronze nut to table  P-016 → P-004 / H-007</text>
<text x='980.0' y='268.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#5a6a4a' text-anchor='start'>Both nuts; chain-coupled rotation.</text>
<text x='40.0' y='293.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#3d5a4c' text-anchor='start' font-weight='600'>STOP SETUPS  —  do not move the stop until the listed parts are done</text>
<text x='40.0' y='317.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>S-001</text>
<text x='110.0' y='317.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Stop: side height  30"  P-001L, P-001R</text>
<text x='40.0' y='334.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>S-002</text>
<text x='110.0' y='334.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Stop: side depth  22"  P-001L, P-001R</text>
<text x='40.0' y='351.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>S-003</text>
<text x='110.0' y='351.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Stop: stretcher length (hous  17"  P-003 ×3</text>
<text x='40.0' y='368.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>S-004</text>
<text x='110.0' y='368.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Stop: stretcher width  4"  P-003 ×3</text>
<text x='40.0' y='385.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>S-005</text>
<text x='110.0' y='385.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Stop: table skins  16" × 22"  P-004 ×2</text>
<text x='40.0' y='402.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>S-006</text>
<text x='110.0' y='402.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Dado: stretcher housing  depth 0.25" · width 0.75"  P-001L, P-001R</text>
<text x='40.0' y='419.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>S-007</text>
<text x='110.0' y='419.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Rebate: way  depth 0.520" · width 0.75"  P-001L, P-001R</text>
<text x='40.0' y='436.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>S-008</text>
<text x='110.0' y='436.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Stack-drill bearing CL  Y 11" from infeed · Z 18.5" from bot  P-001L+R</text>
<text x='40.0' y='453.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>S-009</text>
<text x='110.0' y='453.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Pack-bore discs  ⌀0.75"  P-008, P-009</text>
<text x='40.0' y='470.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>S-010</text>
<text x='110.0' y='470.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>True drum  TIR ≤ 0.002"  A-DRUM</text>
<text x='40.0' y='487.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>S-011</text>
<text x='110.0' y='487.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>A/B clock  |A−B| ≤ 0.003" paper on  A-TABLE, A-DRUM</text>
<text x='40.0' y='512.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#3d5a4c' text-anchor='start' font-weight='600'>QA GATES</text>
<text x='40.0' y='534.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>QC-01</text>
<text x='110.0' y='534.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Ply thickness: Measure ply_actual (default 0.75"). Keep inner span 16.5</text>
<text x='840.0' y='534.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>QC-02</text>
<text x='910.0' y='534.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Paired sides: P-001L/R identical hole pattern after stack-drill</text>
<text x='40.0' y='556.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>QC-03</text>
<text x='110.0' y='556.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Box diagonals: Base diagonals equal; no rack</text>
<text x='840.0' y='556.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>QC-04</text>
<text x='910.0' y='556.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Way coplanar: Winding sticks / indicator on both UHMW — no twist</text>
<text x='40.0' y='578.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>QC-05</text>
<text x='110.0' y='578.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Table flatness: ≤ 0.004″ on both diagonals of P-006</text>
<text x='840.0' y='578.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>QC-06</text>
<text x='910.0' y='578.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Drum TIR paper off: ≤ 0.002″ mid-span</text>
<text x='40.0' y='600.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>QC-07</text>
<text x='110.0' y='600.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Drum ∥ table paper on: |A−B| ≤ 0.003″ over 15.5″</text>
<text x='840.0' y='600.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>QC-08</text>
<text x='910.0' y='600.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Hold-down set: Rollers 0.030″ below drum OD, paper on</text>
<text x='40.0' y='622.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>QC-09</text>
<text x='110.0' y='622.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Pulley coplanar: Straightedge across both pulley faces</text>
<text x='840.0' y='622.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>QC-10</text>
<text x='910.0' y='622.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Thickness scatter: ≤ 0.003″ on four corners of witness board</text>
<text x='40.0' y='644.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>QC-11</text>
<text x='110.0' y='644.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Idler float: Shaft can grow axially; no banana preload</text>
<text x='840.0' y='644.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>QC-12</text>
<text x='910.0' y='644.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Way/table fit: Table slides; project 0.230″; clearance 0.020″/side</text>
<text x='40.0' y='900.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#3d5a4c' text-anchor='start' font-weight='600'>DECISIONS B.1</text>
<text x='40.0' y='928.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>D-022</text>
<text x='110.0' y='928.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Persistent part IDs P/H/J/A; Python is SSOT  —  Drawings, BOM, viewer, and OpenSCAD were duplicating 16.5 / 14 / 18.5</text>
<text x='40.0' y='946.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>D-023</text>
<text x='110.0' y='946.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Wandel-style individual part, assembly, and hardware sheets  —  Overview D-sheets are not enough to fabricate P-001 from; each make pa</text>
<text x='40.0' y='964.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>D-024</text>
<text x='110.0' y='964.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Idler float is an axial pad, not YZ slots in the side panel  —  Face-plane slots let the drum axis wander; shaft growth is through the</text>
<text x='40.0' y='1000.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#3d5a4c' text-anchor='start' font-weight='600'>FMEA (shop, not certified structural analysis)</text>
<text x='40.0' y='1024.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Table rack under feed: J-001 housing + J-002 rebate ways</text>
<text x='40.0' y='1040.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Banana shaft: J-007 axial float</text>
<text x='40.0' y='1056.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Snipe: Light H-011; 0.030″ set</text>
<text x='40.0' y='1072.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1a1f24' text-anchor='start'>Helical tracks: Optional H-025; or 90° finish pass</text>
