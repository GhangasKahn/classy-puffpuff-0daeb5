<text x='912.0' y='307.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#ffffff' text-anchor='start' font-weight='600'>BEFORE YOU MOVE ON   (QC-12 · QC-13)</text>
<text x='912.0' y='338.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#1a1a1a' text-anchor='start'>Rebate 0.520″ deep ±0.010″; a scrap of way stock sits 0.230″</text>
<text x='912.0' y='356.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#1a1a1a' text-anchor='start'>proud. Dados at IN-LO / OUT-LO / OUT-HI only.</text>
<text x='912.0' y='380.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d4a38' text-anchor='start'>Still correctable after this step: A rebate can go deeper,</text>
<text x='912.0' y='397.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d4a38' text-anchor='start'>never shallower.</text>
<rect x='900.0' y='420.0' width='720.0' height='62.0' fill='#f6e7e4' stroke='#a8342a' stroke-width='1.4'/>
<text x='914.0' y='440.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#a8342a' text-anchor='start' font-weight='600'>⚠ Do not dado the panels while they are still stacked. You</text>
<text x='914.0' y='458.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#a8342a' text-anchor='start'>   will get two left-hand sides.</text>
