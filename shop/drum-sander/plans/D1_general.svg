<text x='780.0' y='560.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>LINEAGE: ShopNotes 86 → Walters → Rev A solid table → Rev B geometry.</text>
<text x='780.0' y='586.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>FEED: Table in UHMW ways + spring hold-downs. Conveyor still deleted.</text>
<text x='780.0' y='612.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>LIFT: Dual ½-10 Acme, chain-coupled. Left uncouples for taper; home dog.</text>
<text x='780.0' y='638.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>DRIVE: 3″ / 5″ pulleys → ~1035 RPM · ~1350 sfpm. Pulley faces coplanar.</text>
<text x='780.0' y='664.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>DRUM: Pack-bored discs · floating idler bearing · true, then wrap, then re-clock.</text>
<text x='780.0' y='690.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>QUALITY: |A−B| ≤ 0.003″ paper-on · TIR ≤ 0.002″ · 0.001″ finish passes.</text>
<text x='780.0' y='716.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1a1f24' text-anchor='start'>SAFETY: Hood is a guard. Hold-downs on. Never open while spinning.</text>
