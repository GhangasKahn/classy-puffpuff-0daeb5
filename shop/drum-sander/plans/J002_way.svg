<text x='46.0' y='168.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#3d4a38' text-anchor='start' font-weight='600'>Joint geometry</text>
<text x='780.0' y='150.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>GEOMETRY</text>
<text x='780.0' y='172.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Vertical strip centered on drum CL. Y 9.75–12.25″. Z</text>
<text x='780.0' y='188.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  11–16.438″.</text>
<text x='780.0' y='208.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Rebate 0.520″ so the way projects 0.230″. Without it a 16″</text>
<text x='780.0' y='224.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  table will not enter a 16.5″ span.</text>
<text x='780.0' y='244.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• This is not a horizontal shelf. The table does not sit on</text>
<text x='780.0' y='260.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  the way; shoes wrap it and the Acme lifts in Z.</text>
<text x='780.0' y='400.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>CUT SEQUENCE</text>
<text x='780.0' y='422.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Router + edge guide on the inner face after the pair is</text>
<text x='780.0' y='438.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  split (S-007).</text>
<text x='780.0' y='458.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Depth-cut on an offcut first. Bond P-007, optional #8</text>
<text x='780.0' y='474.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  flush from outside, paste wax only.</text>
<text x='36.0' y='600.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>ACCEPTANCE</text>
<text x='36.0' y='622.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Projection 0.230″ ±0.010″. Ways plumb to the base (QC-04).</text>
<text x='36.0' y='642.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Way covers table travel from 11.5″ to 15.94″.</text>
<text x='860.0' y='600.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>MOVEMENT / CONSTRAINT</text>
<text x='860.0' y='622.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Way FIXED to the side. Table shoes SLIDE in Z, CAPTURED in</text>
<text x='860.0' y='638.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  X and Y (J-012).</text>
<text x='860.0' y='658.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• No oil. Paste wax. Oil migrates into the birch and into</text>
<text x='860.0' y='674.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  the finish on the work.</text>
</svg>
