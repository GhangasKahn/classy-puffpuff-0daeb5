<text x='40.0' y='890.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>Front / mid / rear: 16.5" long × 4" × ¾" Baltic birch. Glue + screws. Mid stretcher carries elev nut.</text>
<text x='40.0' y='920.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>Idler-side bearing pad: oak block with jack screws or shim stack — Walters' recommended fix for out-of-parallel after paper wrap.</text>
