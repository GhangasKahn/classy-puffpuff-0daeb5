<text x='50.0' y='118.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#3d4a38' text-anchor='start' font-weight='600'>Wear face up — this is the plane you indicate</text>
<text x='980.0' y='140.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>TABLE BUILD</text>
<text x='980.0' y='160.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Glue the box. Flatten. Then bond the wear face. QC-05 before</text>
<text x='980.0' y='176.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  any sanding.</text>
<text x='980.0' y='196.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Bronze nuts P-016 on the underside, both ends. Chain-couple</text>
<text x='980.0' y='212.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  the ½-10 screws.</text>
<text x='980.0' y='232.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Uncouple LEFT for taper work. Recouple against the home dog —</text>
<text x='980.0' y='248.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  that dog is the last known parallel.</text>
<text x='980.0' y='268.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Table must slide on the ways with 0.02" clearance per side. If</text>
<text x='980.0' y='284.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  it does not enter, the ways are proud — see D-020.</text>
</svg>
