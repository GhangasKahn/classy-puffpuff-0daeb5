<text x='46.0' y='861.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='600'>3</text>
<text x='68.0' y='862.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#2a2a2a' text-anchor='start'>If it is not 0.75″, edit ply_actual in cad/walter_ds16.py and regenerate every</text>
<text x='68.0' y='880.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#2a2a2a' text-anchor='start'>sheet. Do not shave the 16.5″ inner span to make the old numbers work.</text>
