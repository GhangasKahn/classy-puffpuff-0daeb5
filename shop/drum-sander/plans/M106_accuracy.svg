<text x='36.0' y='620.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>HOW TO READ THIS</text>
<text x='36.0' y='644.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#2a2a2a' text-anchor='start'>• Rev B used one number (0.003″) for both columns. CALC-C06: they differ. ALN-01 spec 0.003″. TV-01 spec 0.005″.</text>
<text x='36.0' y='668.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#2a2a2a' text-anchor='start'>• Rev B TV RSS ≈ 21.8 mil against a 3 mil claim → FAIL. Rev C TV RSS ≈ 4.5 mil against 5 mil → PASS on RSS.</text>
<text x='36.0' y='692.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#2a2a2a' text-anchor='start'>• The largest Rev B TV term was 20 mil of way play. The gib (D-042 / P-022) removes it. The next largest was drum crown — that is M-107.</text>
<text x='36.0' y='716.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#2a2a2a' text-anchor='start'>• ALN-01 is a setup measurement. TV-01 is what the board feels. Pass ALN-01 first; then cut the witness board.</text>
</svg>
