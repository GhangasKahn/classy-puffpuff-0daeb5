<text x='50.0' y='118.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#3d4a38' text-anchor='start' font-weight='600'>Box + ways — inner span 16.50″ is the constraint</text>
<text x='980.0' y='140.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>ASSEMBLY ORDER</text>
<text x='980.0' y='160.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• 1. Cut P-001L/R to one height stop and one depth stop (S-001,</text>
<text x='980.0' y='176.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  S-002).</text>
<text x='980.0' y='196.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• 2. Stack-drill bearing CL, flange bolts, stretcher pilots</text>
<text x='980.0' y='212.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  (S-008).</text>
<text x='980.0' y='232.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• 3. Split. Dado J-001 and rebate J-002 on inner faces only</text>
<text x='980.0' y='248.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  (mirror).</text>
<text x='980.0' y='268.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• 4. Dry-fit P-003. Clamp, square diagonals, glue,</text>
<text x='980.0' y='284.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  through-screw.</text>
<text x='980.0' y='304.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• 5. Bond P-007. Wax. Table must slide; if it binds you stole</text>
<text x='980.0' y='320.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  the span.</text>
<text x='980.0' y='340.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Keep 16.5" (419 mm) between inner faces even if ply is 18 mm</text>
<text x='980.0' y='356.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  Euro BB.</text>
<text x='980.0' y='376.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Idler flange: axial pad. Drive flange: lock. Do not lock both.</text>
