<text x='992.0' y='270.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>Mounted ball bearing, 1¼″ bore,</text>
<text x='992.0' y='287.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>self-aligning, FLOATING (idler)</text>
<text x='1352.0' y='270.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d4a38' text-anchor='start' font-weight='600'>x1</text>
<text x='912.0' y='316.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='11' fill='#3d4a38' text-anchor='start'>TOOLS: Drill press · Forstner bits · Clamps · Awl</text>
<text x='912.0' y='332.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='11' fill='#3d5a4c' text-anchor='start'>OPEN THESE SHEETS: P-001L · P-001R</text>
<rect x='900.0' y='354.0' width='720.0' height='30.0' fill='#5f8f62' stroke='#1a1a1a' stroke-width='1.2'/>
<text x='912.0' y='375.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#ffffff' text-anchor='start' font-weight='600'>BEFORE YOU MOVE ON   (QC-02)</text>
<text x='912.0' y='406.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#1a1a1a' text-anchor='start'>Panels separated; hole patterns line up when the panels are</text>
<text x='912.0' y='424.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#1a1a1a' text-anchor='start'>flipped face-to-face.</text>
<text x='912.0' y='448.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>HOLD POINT: Stop here until the flange is in your hand. Do not</text>
<text x='912.0' y='465.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d5a4c' text-anchor='start'>drill this pattern from the drawing alone.</text>
<text x='912.0' y='488.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d4a38' text-anchor='start'>Still correctable after this step: Almost nothing. This</text>
<text x='912.0' y='505.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d4a38' text-anchor='start'>pattern is the datum for the whole machine.</text>
<rect x='900.0' y='528.0' width='720.0' height='62.0' fill='#f6e7e4' stroke='#a8342a' stroke-width='1.4'/>
<text x='914.0' y='548.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#a8342a' text-anchor='start' font-weight='600'>⚠ Clamp hard. A panel that shifts mid-drill gives you two</text>
<text x='914.0' y='566.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#a8342a' text-anchor='start'>   different machines.</text>
