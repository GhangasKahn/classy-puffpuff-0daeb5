<text x='90.0' y='538.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#3d4a38' text-anchor='start' font-weight='600'>Isometric shell</text>
<text x='820.0' y='160.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>SHOP NOTES</text>
<text x='820.0' y='180.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• This part is why Rev C holds the accuracy spec. Do not</text>
<text x='820.0' y='196.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  substitute decorative thin-wall tube (MC-01).</text>
<text x='820.0' y='216.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Cut from 18″ stock. Face both ends square. Finished length</text>
<text x='820.0' y='232.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  15.75″ matches the 21-disc pack so Option B remains a drop-in.</text>
<text x='820.0' y='252.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Bond and cross-pin to P-021 (J-106). Never adhesive alone on a</text>
<text x='820.0' y='268.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  rotating part.</text>
<text x='820.0' y='288.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• True the OD in the machine's own bearings (ST-13). Truing in a</text>
<text x='820.0' y='304.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  lathe and then moving the drum re-introduces TIR.</text>
<text x='820.0' y='324.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Option B (P-008/P-009 stack) is the documented no-lathe</text>
<text x='820.0' y='340.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  alternative with an explicit accuracy penalty (D-047).</text>
</svg>
