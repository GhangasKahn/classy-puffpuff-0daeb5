<text x='46.0' y='168.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#3d4a38' text-anchor='start' font-weight='600'>Force through the nuts, capture in the shoes, cut on the drum CL</text>
<text x='960.0' y='160.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>THREE PLANES</text>
<text x='960.0' y='184.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>1. TABLE PLANE</text>
<text x='960.0' y='202.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>Torsion box + wear face. Flat ≤ 0.004″. Lifts in Z on</text>
<text x='960.0' y='217.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>dual Acme. Shoes wrap vertical ways so it cannot rack in</text>
<text x='960.0' y='232.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>X or yaw in Y. Operator feeds the work; the table is not</text>
<text x='960.0' y='247.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>a conveyor and is not a Y-slide in use.</text>
<text x='960.0' y='272.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>2. DRUM AXIS</text>
<text x='960.0' y='290.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>Y 11″, Z 18.5″. Pack-bore, true, wrap, re-clock. Drive</text>
<text x='960.0' y='305.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>FIXED (J-006), idler FLOATING axial (J-007). TIR ≤</text>
<text x='960.0' y='320.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>{S.drum_tir:.3f}″ then paper-on |A−B| ≤</text>
<text x='960.0' y='335.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>{S.parallel_tol:.3f}″.</text>
<text x='960.0' y='360.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>3. FEED</text>
<text x='960.0' y='378.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>Hold-down rollers 0.030″ below the drum, paper on. Work</text>
<text x='960.0' y='393.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>is pushed by hand. Min length ~12″ or the sled. No wide</text>
<text x='960.0' y='408.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>conveyor — that is the ShopNotes failure mode this</text>
<text x='960.0' y='423.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>machine deleted.</text>
<text x='960.0' y='448.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>LIFT MATH</text>
<text x='960.0' y='468.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>CALC-001  1035 RPM</text>
<text x='960.0' y='486.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>CALC-002  1355 sfpm</text>
<text x='960.0' y='504.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>CALC-003  0.100″/rev · 30 turns for 3″</text>
<text x='960.0' y='522.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>CALC-004  6.062″ minimum clearance</text>
<text x='960.0' y='540.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>CALC-005  X play 0.010″ · Y play 0.016″</text>
<text x='36.0' y='700.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>Primary layout system: HYBRID. Panel joinery is face/edge. Drum, lift, and ways are centerline from DATUM-B / DATUM-A.</text>
<text x='36.0' y='724.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Do not put Acme screws at the infeed and outfeed. That was a drawing error: dual-end means left/right X, both at drum CL Y.</text>
<text x='36.0' y='744.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Do not use the stretchers as a table shelf. A rail at Z=12 collides with a 3″-open table.</text>
<text x='36.0' y='764.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Optional Y-slide for setup only, then locked. In use the table moves in Z.</text>
</svg>
