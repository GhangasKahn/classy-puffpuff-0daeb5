<text x='50.0' y='118.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#3d4a38' text-anchor='start' font-weight='600'>⌀5.00" × 15.75"  ·  ~1035 RPM</text>
<text x='1060.0' y='140.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>DRUM BUILD</text>
<text x='1060.0' y='160.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Pack-bore every disc in P-015. BB ends (P-009) take flange</text>
<text x='1060.0' y='176.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  crush — static-balance them.</text>
<text x='1060.0' y='196.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Drive bearing H-001 locked to P-001L (J-006). This is DATUM-E.</text>
<text x='1060.0' y='216.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Idler H-002 on the axial pad (J-007). Snug bolts. If the shaft</text>
<text x='1060.0' y='232.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  rings when you rap it, you over-constrained it.</text>
<text x='1060.0' y='252.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• True on P-013 to TIR ≤ 0.002″ paper-off, then Velcro wrap,</text>
<text x='1060.0' y='268.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  then re-clock |A−B| ≤ 0.003″ paper-on.</text>
<text x='1060.0' y='288.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Spiral wrap, 3″ paper on 4″ hook. Optional ⅛″ slow osc erases</text>
<text x='1060.0' y='304.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  tracks — that motor is not drum RPM.</text>
</svg>
