<text x='50.0' y='118.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#3d4a38' text-anchor='start' font-weight='600'>⌀5.00" × 15.75"  ·  ~1207.5 RPM  ·  1¼″ shaft</text>
<text x='1060.0' y='140.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>DRUM BUILD</text>
<text x='1060.0' y='160.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• OPTION A (baseline): turn P-021 plugs in one lathe setup,</text>
<text x='1060.0' y='176.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  bond+pin into P-020 (J-106). Wall is stiffness, not cosmetics</text>
<text x='1060.0' y='192.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  (CALC-C02).</text>
<text x='1060.0' y='212.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• OPTION B (no lathe): pack-bore P-008/P-009 in P-015. Accept</text>
<text x='1060.0' y='228.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  the accuracy penalty (D-047) — the stack is not structural in</text>
<text x='1060.0' y='244.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  bending.</text>
<text x='1060.0' y='264.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Drive bearing H-001 locked to P-001L (J-006). This is DATUM-E.</text>
<text x='1060.0' y='284.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Idler H-002 on P-023 micro-adjust plate (J-105 / J-007). Snug</text>
<text x='1060.0' y='300.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  bolts. Axial float required.</text>
<text x='1060.0' y='320.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• True on P-013 in the machine's own bearings to TIR ≤ 0.0015″</text>
<text x='1060.0' y='336.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  paper-off, then wrap, then ALN-01 |A−B| ≤ 0.003″ paper-on.</text>
<text x='1060.0' y='356.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Spiral wrap, 3″ paper on 4″ hook. Optional ⅛″ slow osc erases</text>
<text x='1060.0' y='372.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  tracks — that motor is not drum RPM.</text>
</svg>
