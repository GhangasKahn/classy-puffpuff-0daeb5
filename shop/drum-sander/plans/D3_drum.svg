<text x='440.0' y='550.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#5a6a4a' text-anchor='start'>MDF / BB CORE  (+ 1 mm relief every 4)</text>
<text x='728.0' y='550.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>BB END</text>
<circle cx='1520.0' cy='400.0' r='55.0' fill='#6e7578' stroke='#1a1f24' stroke-width='2'/>
<text x='1520.0' y='480.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#5a6a4a' text-anchor='middle'>5" PULLEY</text>
<rect x='160.0' y='330.0' width='50.0' height='140.0' fill='#8a9098' stroke='#1a1f24' stroke-width='1.5'/>
<text x='185.0' y='500.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#3d5a4c' text-anchor='middle' font-weight='600'>DRIVE FIXED</text>
<rect x='1380.0' y='330.0' width='50.0' height='140.0' fill='#8a9098' stroke='#1a1f24' stroke-width='1.5'/>
<text x='1405.0' y='500.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#3d5a4c' text-anchor='middle' font-weight='600'>IDLER FLOAT</text>
<text x='1180.0' y='540.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start'>axial slots — do not lock both</text>
<text x='40.0' y='620.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#3d5a4c' text-anchor='start' font-weight='600'>KEYING &amp; GLUE</text>
<text x='40.0' y='660.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>•  Cross-drill shaft; drive 0.125" piano wire stubs so discs cannot spin on shaft.</text>
<text x='40.0' y='688.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>•  Laminate with polyurethane or waterproof PVA; clamp axially while curing.</text>
<text x='40.0' y='716.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>•  MDF option: 1 mm cardboard/plastic relief every 4 discs — prevents glue-swell cracks (Walters/Wandel).</text>
<text x='40.0' y='744.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>•  Birch option: all Baltic birch discs — heavier, more stable (Heslop preference after MDF roller issues).</text>
<text x='40.0' y='772.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>•  Pack-bore all discs in a jig (not one-at-a-time) so the bore is coaxial. Static-balance end discs.</text>
<text x='40.0' y='800.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>•  True OD on the full-width sled that rides the ways (TIR ≤ 0.002″). THEN wrap paper. THEN re-clock A/B.</text>
<text x='40.0' y='828.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>•  Wrap 4.0" hook Velcro; spiral 3.0" loop paper. Paper thickness is not uniform — expect A/B to move.</text>
<text x='40.0' y='860.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#3d5a4c' text-anchor='start' font-weight='600'>DRIVE MATH</text>
<text x='40.0' y='890.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1a1f24' text-anchor='start'>RPM_drum = 1725 × (3/5) ≈ 1035 RPM   ·   Surface ≈ π × 5/12 × 1035 ≈ 1,350 sfpm</text>
<text x='40.0' y='920.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#5a6a4a' text-anchor='start'>Walters ran ~1100 RPM with a ~4.75″ drum pulley. Either ratio is fine; keep belt aligned and locked.</text>
</svg>
