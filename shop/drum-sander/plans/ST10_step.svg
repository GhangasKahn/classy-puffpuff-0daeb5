<text x='912.0' y='219.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>P-021</text>
<text x='992.0' y='219.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>Drum end plug</text>
<text x='1352.0' y='219.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d4a38' text-anchor='start' font-weight='600'>x2</text>
<text x='1400.0' y='219.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#3d4a38' text-anchor='start'>4.5" × 4.5" × 1.5"</text>
<text x='912.0' y='236.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#c4783a' text-anchor='start' font-weight='600'>H-027</text>
<text x='992.0' y='236.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>Aluminium round tube 5″ OD × 0.25″</text>
<text x='992.0' y='253.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>wall — drum shell stock</text>
<text x='1352.0' y='236.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d4a38' text-anchor='start' font-weight='600'>x1</text>
<text x='912.0' y='270.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#c4783a' text-anchor='start' font-weight='600'>H-033</text>
<text x='992.0' y='270.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>Two-part structural epoxy for</text>
<text x='992.0' y='287.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>aluminium</text>
<text x='1352.0' y='270.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d4a38' text-anchor='start' font-weight='600'>x1</text>
<text x='912.0' y='304.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#c4783a' text-anchor='start' font-weight='600'>H-018</text>
<text x='992.0' y='304.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>⅛″ piano wire</text>
<text x='1352.0' y='304.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#3d4a38' text-anchor='start' font-weight='600'>x1</text>
<text x='912.0' y='333.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='11' fill='#3d4a38' text-anchor='start'>TOOLS: Solvent + abrasive pad · Drill press · Clamps · Square</text>
<text x='912.0' y='349.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='11' fill='#3d5a4c' text-anchor='start'>OPEN THESE SHEETS: P-020 · P-021 · J-106 · A-02</text>
<rect x='900.0' y='371.0' width='720.0' height='30.0' fill='#5f8f62' stroke='#1a1a1a' stroke-width='1.2'/>
<text x='912.0' y='392.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#ffffff' text-anchor='start' font-weight='600'>BEFORE YOU MOVE ON</text>
<text x='912.0' y='423.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#1a1a1a' text-anchor='start'>Both plugs seated at the specified inset, square, fully cured,</text>
<text x='912.0' y='441.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='13' fill='#1a1a1a' text-anchor='start'>and pinned.</text>
<text x='912.0' y='465.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d5a4c' text-anchor='start' font-weight='600'>HOLD POINT: FULL CURE per the adhesive data sheet before the</text>
<text x='912.0' y='482.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d5a4c' text-anchor='start'>drum turns under power. This is a 18 lb rotating assembly.</text>
<text x='912.0' y='505.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d4a38' text-anchor='start'>Still correctable after this step: The OD — that is what</text>
<text x='912.0' y='522.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#3d4a38' text-anchor='start'>truing is for. Not the plug position.</text>
<rect x='900.0' y='545.0' width='720.0' height='62.0' fill='#f6e7e4' stroke='#a8342a' stroke-width='1.4'/>
<text x='914.0' y='565.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#a8342a' text-anchor='start' font-weight='600'>⚠ Never rely on adhesive alone on a rotating part. The</text>
<text x='914.0' y='583.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#a8342a' text-anchor='start'>   cross-pins are not optional.</text>
