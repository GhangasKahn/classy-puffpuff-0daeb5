<text x='80.0' y='984.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Ends sit in ¼″ dados on the inner faces, standing on edge (4″</text>
