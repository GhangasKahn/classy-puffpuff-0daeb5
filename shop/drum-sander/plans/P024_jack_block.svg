<text x='80.0' y='948.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Tap ¼-28 through. A ragged thread reads as backlash in ALN-01.</text>
