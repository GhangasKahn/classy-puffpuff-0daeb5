<text x='840.0' y='260.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>At the work, per revolution</text>
<text x='1120.0' y='260.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>6.17 mil</text>
<text x='1300.0' y='260.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>CALC-C07</text>
<text x='840.0' y='286.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>At the work, per 15°</text>
<text x='1120.0' y='286.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>0.26 mil</text>
<text x='1300.0' y='286.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>use small fractions of a turn</text>
<text x='840.0' y='312.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>Acme ½-10 travel / rev</text>
<text x='1120.0' y='312.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>0.100"</text>
<text x='1300.0' y='312.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>40 div handwheel</text>
<text x='840.0' y='338.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>Handwheel per division</text>
<text x='1120.0' y='338.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>2.50 mil</text>
<text x='1300.0' y='338.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>CALC-C10</text>
<text x='840.0' y='364.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>Acme self-locking?</text>
<text x='1120.0' y='364.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>YES</text>
<text x='1300.0' y='364.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>threshold μ 0.071</text>
<text x='840.0' y='390.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>Approach the setting</text>
<text x='1120.0' y='390.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>RAISE, then lock ways</text>
<text x='1300.0' y='390.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#1a1a1a' text-anchor='start'>D-044 — backlash is then out of the budget</text>
<text x='80.0' y='560.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#3d5a4c' text-anchor='start' font-weight='600'>SHOP NOTES</text>
<text x='80.0' y='580.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Two adjustments that must not be confused: the GIB (P-022)</text>
<text x='80.0' y='596.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  sets running clearance. The JACK (P-023/P-024) sets drum</text>
<text x='80.0' y='612.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  parallelism. Set the gib first and leave it while clocking</text>
<text x='80.0' y='628.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  ALN-01.</text>
<text x='80.0' y='648.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• ¼-20 is excluded for the jack: resolution degrades ~40%.</text>
<text x='80.0' y='664.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  Recompute if you substitute M6×0.75.</text>
<text x='80.0' y='684.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>• Required self-align of the insert ≥ 0.011° so the bearing does</text>
<text x='80.0' y='700.0' font-family='Libre Franklin, Helvetica, Arial, sans-serif' font-size='12' fill='#2a2a2a' text-anchor='start'>  not fight the jack (CALC-C08).</text>
