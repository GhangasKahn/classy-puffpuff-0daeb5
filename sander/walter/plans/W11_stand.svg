<text x='234.0' y='844.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#6b5340' text-anchor='middle'>22.00"</text>
<rect x='520.0' y='100.0' width='700.0' height='130.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='532.0' y='122.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>WHY A STAND</text>
<text x='532.0' y='140.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Platen at ~36–40" AFF is kinder on a long session than a bench.</text>
<text x='532.0' y='158.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Shelf holds the magnetic starter, 24 V PSU, and extra abrasive rolls.</text>
<text x='532.0' y='176.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• 4" hose can drop inside the cabinet to a collector behind.</text>
<text x='532.0' y='194.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Mobile base (Rockler / Shop Fox pattern) — lock the casters to sand.</text>
<text x='532.0' y='212.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Do not store finishing rags in here. Fine dust is fuel.</text>
<rect x='520.0' y='320.0' width='700.0' height='130.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='532.0' y='342.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>CUT LIST (optional)</text>
<text x='532.0' y='360.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>N  Stand sides     32.00 × 32.00 × ¾"  ×2</text>
<text x='532.0' y='378.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>P  Shelf           20.50 × 32.00 × ¾"  ×1</text>
<text x='532.0' y='396.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>P  Back            22.00 × 32.00 × ¾"  ×1</text>
<text x='532.0' y='414.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>   Bottom stretcher 20.50 × 4.00 × ¾"  ×2</text>
<text x='532.0' y='432.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>   Bolt machine through base rails into cabinet top with 5/16" + fender washers.</text>
<rect x='520.0' y='540.0' width='700.0' height='94.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='532.0' y='562.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>OPEN C-FRAME OPTION  (Todd Hunt)</text>
<text x='532.0' y='580.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>If you need &gt;16" width, do not stretch this closed frame. Design a C-frame</text>
<text x='532.0' y='598.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>with a thicker idle bearing wall (two ¾" + ¼" plate) and a 1.5–2 HP motor.</text>
<text x='532.0' y='616.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>That is a different machine. WALTER stays closed-frame on purpose.</text>
</svg>
