<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='1680' height='1188' viewBox='0 0 1680 1188'>
<rect x='0.0' y='0.0' width='1680.0' height='1188.0' fill='#f4efe6' stroke='#1c1914' stroke-width='3'/>
<rect x='24.0' y='24.0' width='1632.0' height='1140.0' fill='none' stroke='#1c1914' stroke-width='1.2'/>
<line x1='24.0' y1='1098.0' x2='1656.0' y2='1098.0' stroke='#1c1914' stroke-width='1.5'/>
<text x='40.0' y='1130.0' font-family='Georgia, serif' font-size='28' fill='#b4532a' text-anchor='start' font-weight='600'>WALTER</text>
<text x='175.0' y='1126.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='18' fill='#1c1914' text-anchor='start' font-weight='600'>W-9  ·  Exploded assembly</text>
<text x='40.0' y='1154.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='start'>CAD explode = 1.0  ·  print the SVG render at /renders/walter_exploded.svg</text>
<text x='1640.0' y='1130.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#6b5340' text-anchor='end'>16″ closed-frame drum thickness sander</text>
<text x='1640.0' y='1154.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='end'>Original engineering  ·  Rev B  ·  Shop build</text>
<text x='40.0' y='62.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#b4532a' text-anchor='start' font-weight='600'>GROUP BREAKDOWN  —  BUILD IN THIS ORDER</text>
<rect x='40.0' y='100.0' width='780.0' height='70.0' fill='#efe8dc' stroke='#d4cbb8' stroke-width='1'/>
<text x='56.0' y='128.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#b4532a' text-anchor='start' font-weight='600'>1  FRAME</text>
<text x='56.0' y='152.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Base, doubled walls, stretchers, ¼" steel bearing plates. Square before glue.</text>
<rect x='40.0' y='178.0' width='780.0' height='70.0' fill='#efe8dc' stroke='#d4cbb8' stroke-width='1'/>
<text x='56.0' y='206.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#b4532a' text-anchor='start' font-weight='600'>2  DRUM</text>
<text x='56.0' y='230.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Keyed shaft, 21 birch discs, end bells, flange bearings, 4.75" pulley.</text>
<rect x='40.0' y='256.0' width='780.0' height='70.0' fill='#efe8dc' stroke='#d4cbb8' stroke-width='1'/>
<text x='56.0' y='284.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#b4532a' text-anchor='start' font-weight='600'>3  TABLE</text>
<text x='56.0' y='308.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Torsion-box platen, UHMW ways, dual Acme, HTD sync, lock knobs.</text>
<rect x='40.0' y='334.0' width='780.0' height='70.0' fill='#efe8dc' stroke='#d4cbb8' stroke-width='1'/>
<text x='56.0' y='362.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#b4532a' text-anchor='start' font-weight='600'>4  CONVEYOR</text>
<text x='56.0' y='386.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Crowned 2" rollers, 16×60 PVC belt, skew, 24 V gearmotor.</text>
<rect x='40.0' y='412.0' width='780.0' height='70.0' fill='#efe8dc' stroke='#d4cbb8' stroke-width='1'/>
<text x='56.0' y='440.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#b4532a' text-anchor='start' font-weight='600'>5  DRIVE</text>
<text x='56.0' y='464.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Hinge plate, 1 HP TEFC, 3.00" pulley, 4L440, turnbuckle, guard.</text>
<rect x='40.0' y='490.0' width='780.0' height='70.0' fill='#efe8dc' stroke='#d4cbb8' stroke-width='1'/>
<text x='56.0' y='518.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#b4532a' text-anchor='start' font-weight='600'>6  HOOD</text>
<text x='56.0' y='542.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>¼" birch hood, 4" port, brush strip, optional interlock.</text>
<rect x='40.0' y='568.0' width='780.0' height='70.0' fill='#efe8dc' stroke='#d4cbb8' stroke-width='1'/>
<text x='56.0' y='596.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='16' fill='#b4532a' text-anchor='start' font-weight='600'>7  STAND (opt.)</text>
<text x='56.0' y='620.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>32" cabinet, shelf for starter / PSU, mobile base.</text>
<text x='860.0' y='62.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#b4532a' text-anchor='start' font-weight='600'>EXPLODE DIRECTIONS (kernel)</text>
<text x='860.0' y='92.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1c1914' text-anchor='start'>frame   (0, 0, 0)</text>
<text x='860.0' y='116.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1c1914' text-anchor='start'>drum    +Z  8"</text>
<text x='860.0' y='140.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1c1914' text-anchor='start'>table   −Z  6"</text>
<text x='860.0' y='164.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1c1914' text-anchor='start'>motor   +X  8"</text>
<text x='860.0' y='188.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1c1914' text-anchor='start'>guard   +X  6"</text>
<text x='860.0' y='212.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1c1914' text-anchor='start'>hood    +Z 12"</text>
<rect x='860.0' y='250.0' width='760.0' height='166.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='872.0' y='272.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>CAD FILES</text>
<text x='872.0' y='290.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>sander/walter/cad/walter_kernel.py     geometry (inches)</text>
<text x='872.0' y='308.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>sander/walter/cad/exports/*.stl        binary STL per group + assembly</text>
<text x='872.0' y='326.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>sander/walter/cad/exports/walter_assembly.obj</text>
<text x='872.0' y='344.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>sander/walter/cad/walter_sander.scad   OpenSCAD preview</text>
<text x='872.0' y='362.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>sander/walter/cad/walter_sander.py     FreeCAD STEP when freecadcmd exists</text>
<text x='872.0' y='380.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>sander/walter/renders/walter_exploded.svg</text>
<text x='872.0' y='398.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>python3 scripts/gen_walter_cad.py      regenerates meshes + renders</text>
<rect x='860.0' y='500.0' width='760.0' height='130.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='872.0' y='522.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>CLEARANCES TO HOLD</text>
<text x='872.0' y='540.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Drum face to wall inner: 0.25" each side.</text>
<text x='872.0' y='558.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Table ways: 0.02–0.04" sliding fit in UHMW dados.</text>
<text x='872.0' y='576.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Conveyor belt: 1/32" above platen, not dragging.</text>
<text x='872.0' y='594.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Hood: 3/8" off abrasive. Foam weatherstrip to walls.</text>
<text x='872.0' y='612.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Guard: fully enclosed. No finger slot at the belt pinch.</text>
<rect x='40.0' y='680.0' width='1600.0' height='112.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='52.0' y='702.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>ASSEMBLY DATUMS</text>
<text x='52.0' y='720.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>D1  Base top face = Z0. Walls sit on it. Do not let stretchers lift a wall.</text>
<text x='52.0' y='738.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>D2  Drum axis = Z 13.50", Y 18.00". Drill both bearing plates from one story stick.</text>
<text x='52.0' y='756.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>D3  Idle jack at zero = plates coplanar. Then true the drum. Then jack for parallelism.</text>
<text x='52.0' y='774.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>D4  Acme nuts clocked together before the HTD belt goes on. Paint a witness mark.</text>
</svg>
