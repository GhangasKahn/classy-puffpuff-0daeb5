<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' width='1680' height='1188' viewBox='0 0 1680 1188'>
<rect x='0.0' y='0.0' width='1680.0' height='1188.0' fill='#f4efe6' stroke='#1c1914' stroke-width='3'/>
<rect x='24.0' y='24.0' width='1632.0' height='1140.0' fill='none' stroke='#1c1914' stroke-width='1.2'/>
<line x1='24.0' y1='1098.0' x2='1656.0' y2='1098.0' stroke='#1c1914' stroke-width='1.5'/>
<text x='40.0' y='1130.0' font-family='Georgia, serif' font-size='28' fill='#b4532a' text-anchor='start' font-weight='600'>WALTER</text>
<text x='175.0' y='1126.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='18' fill='#1c1914' text-anchor='start' font-weight='600'>W-5  ·  Conveyor &amp; tracking</text>
<text x='40.0' y='1154.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='start'>The subsystem that failed three times on the original</text>
<text x='1640.0' y='1130.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#6b5340' text-anchor='end'>16″ closed-frame drum thickness sander</text>
<text x='1640.0' y='1154.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='end'>Original engineering  ·  Rev B  ·  Shop build</text>
<text x='40.0' y='62.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#b4532a' text-anchor='start' font-weight='600'>WHY THE ORIGINAL CONVEYOR WOULD NOT TRACK</text>
<text x='40.0' y='82.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='start'>Walters used a 16×48 sanding belt on PVC pipe. He rebuilt it three times. Power feed was fine. Tracking was not.</text>
<rect x='40.0' y='110.0' width='370.0' height='130.0' fill='#efe8dc' stroke='#8a3a2a' stroke-width='1.4'/>
<text x='56.0' y='138.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#8a3a2a' text-anchor='start' font-weight='600'>1  PVC IS NOT ROUND</text>
<text x='56.0' y='164.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Pipe is extruded, oval, and</text>
<text x='56.0' y='184.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>not concentric on a shaft.</text>
<text x='56.0' y='204.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Turn aluminum or stacked birch.</text>
<rect x='430.0' y='110.0' width='370.0' height='130.0' fill='#efe8dc' stroke='#8a3a2a' stroke-width='1.4'/>
<text x='446.0' y='138.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#8a3a2a' text-anchor='start' font-weight='600'>2  NO CROWN</text>
<text x='446.0' y='164.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Flat rollers do not self-center.</text>
<text x='446.0' y='184.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>A 0.030" crown (high in the</text>
<text x='446.0' y='204.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>middle) is the whole trick.</text>
<rect x='820.0' y='110.0' width='370.0' height='130.0' fill='#efe8dc' stroke='#8a3a2a' stroke-width='1.4'/>
<text x='836.0' y='138.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#8a3a2a' text-anchor='start' font-weight='600'>3  WRONG BELT</text>
<text x='836.0' y='164.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Sanding belts are stiff, jointed,</text>
<text x='836.0' y='184.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>and want to walk. Use 2-ply</text>
<text x='836.0' y='204.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>PVC/PU conveyor belting.</text>
<rect x='1210.0' y='110.0' width='430.0' height='130.0' fill='#e4eee6' stroke='#3d5a4c' stroke-width='1.4'/>
<text x='1226.0' y='138.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#3d5a4c' text-anchor='start' font-weight='600'>4  NO SKEW ADJUST</text>
<text x='1226.0' y='164.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>One roller must pivot a few</text>
<text x='1226.0' y='184.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>thou. Two ¼-20 skew screws</text>
<text x='1226.0' y='204.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>on the idle roller pillow.</text>
<text x='40.0' y='280.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#b4532a' text-anchor='start' font-weight='600'>CROWNED ROLLER  —  2.00" OD × 16.25"  ALUMINUM TUBE  ·  ⅝" SHAFT</text>
<polygon points='80.0,430.0 780.0,430.0 780.0,500.0 430.0,482.0 80.0,500.0' fill='#5c656c' stroke='#1c1914' stroke-width='1.6'/>
<line x1='80.0' y1='465.0' x2='780.0' y2='465.0' stroke='#6b5340' stroke-width='1' stroke-dasharray='4 3'/>
<line x1='80.0' y1='500.0' x2='80.0' y2='532.0' stroke='#6b5340' stroke-width='1'/>
<line x1='780.0' y1='500.0' x2='780.0' y2='532.0' stroke='#6b5340' stroke-width='1'/>
<line x1='80.0' y1='524.0' x2='780.0' y2='524.0' stroke='#6b5340' stroke-width='1.4'/>
<polygon points='80.0,524.0 90.0,520.0 90.0,528.0' fill='#6b5340' stroke='#6b5340' stroke-width='0.5'/>
<polygon points='780.0,524.0 770.0,520.0 770.0,528.0' fill='#6b5340' stroke='#6b5340' stroke-width='0.5'/>
<rect x='378.1' y='503.0' width='103.7' height='21.0' fill='#f4efe6'/>
<text x='430.0' y='518.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#6b5340' text-anchor='middle'>16.25" face</text>
<line x1='430.0' y1='482.0' x2='458.0' y2='482.0' stroke='#6b5340' stroke-width='1'/>
<line x1='430.0' y1='500.0' x2='458.0' y2='500.0' stroke='#6b5340' stroke-width='1'/>
<line x1='450.0' y1='482.0' x2='450.0' y2='500.0' stroke='#6b5340' stroke-width='1.4'/>
<polygon points='450.0,482.0 446.0,492.0 454.0,492.0' fill='#6b5340' stroke='#6b5340' stroke-width='0.5'/>
<polygon points='450.0,500.0 446.0,490.0 454.0,490.0' fill='#6b5340' stroke='#6b5340' stroke-width='0.5'/>
<text x='462.0' y='496.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#6b5340' text-anchor='start' transform='rotate(-90 462.0 496.0)'>0.030" crown (exaggerated)</text>
<circle cx='60.0' cy='465.0' r='18.0' fill='#5c656c' stroke='#1c1914' stroke-width='1.2'/>
<circle cx='60.0' cy='465.0' r='7.0' fill='#f4efe6' stroke='#1c1914' stroke-width='1'/>
<text x='430.0' y='414.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='middle'>Turn or lathe-file a gentle barrel. High point at mid-span. Both rollers.</text>
<text x='40.0' y='560.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#b4532a' text-anchor='start' font-weight='600'>TRACKING  —  IDLE ROLLER SKEW</text>
<rect x='80.0' y='590.0' width='640.0' height='200.0' fill='#efe8dc' stroke='#1c1914' stroke-width='1.4'/>
<rect x='120.0' y='640.0' width='28.0' height='120.0' fill='#5c656c' stroke='#1c1914' stroke-width='1.4'/>
<polygon points='560.0,648.0 588.0,652.0 588.0,748.0 560.0,752.0' fill='#5c656c' stroke='#b4532a' stroke-width='1.6'/>
<rect x='148.0' y='690.0' width='412.0' height='18.0' fill='#2a2a2c' stroke='#1c1914' stroke-width='1'/>
<text x='134.0' y='780.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#6b5340' text-anchor='middle'>DRIVE</text>
<text x='574.0' y='780.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#b4532a' text-anchor='middle'>IDLE (skew)</text>
<text x='360.0' y='625.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#6b5340' text-anchor='middle'>Belt walks toward the end that contacts first.</text>
<rect x='80.0' y='810.0' width='640.0' height='112.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='92.0' y='832.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>PROCEDURE</text>
<text x='92.0' y='850.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>1. Tension until the belt does not slip under a 16" oak board.</text>
<text x='92.0' y='868.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>2. Run empty. If it walks left, skew idle so the right end leads slightly.</text>
<text x='92.0' y='886.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>3. Tiny moves. 1/8 turn of a ¼-20 is a lot. Mark the nuts.</text>
<text x='92.0' y='904.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>4. Then feed a board. Reload tension after the first hour — belts stretch.</text>
<text x='860.0' y='280.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#b4532a' text-anchor='start' font-weight='600'>FEED DRIVE</text>
<text x='860.0' y='314.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>BELT</text>
<text x='980.0' y='314.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>16.00" × 60" endless, 2-ply PVC, FS top / FS or bare back</text>
<text x='860.0' y='340.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>NOT</text>
<text x='980.0' y='340.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>a sanding belt. Not rubber inner-tube. Not canvas.</text>
<text x='860.0' y='366.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>CENTERS</text>
<text x='980.0' y='366.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>26.86"  (from 60" belt − π·2.00")</text>
<text x='860.0' y='392.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>TAKE-UP</text>
<text x='980.0' y='392.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>¾" of screw travel on idle bearings</text>
<text x='860.0' y='418.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>MOTOR</text>
<text x='980.0' y='418.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>24 V DC worm gearmotor, ~30 RPM at roller, PWM 0–16 FPM</text>
<text x='860.0' y='444.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>CALC</text>
<text x='980.0' y='444.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>π × 2.00" / 12 × 30 rpm  =  15.7 FPM at 30 rpm</text>
<text x='860.0' y='470.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>MOUNT</text>
<text x='980.0' y='470.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Chain or HTD to drive roller. Motor on the TABLE so height is independent.</text>
<text x='860.0' y='496.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>PLATEN</text>
<text x='980.0' y='496.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>UHMW under the belt, 1/32" below roller crowns, dead flat</text>
<text x='860.0' y='522.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>OPTION B</text>
<text x='980.0' y='522.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Delete conveyor. HDPE sliding table + push stick. Simpler. Slower.</text>
<rect x='860.0' y='570.0' width='760.0' height='112.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='872.0' y='592.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>OPTION B  —  SLIDING TABLE  (if you do not want a belt)</text>
<text x='872.0' y='610.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• 18×24" HDPE on UHMW ways. Fence on the outfeed. Push with a carrier board.</text>
<text x='872.0' y='628.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Same drum, same elevation, same dust hood. No tracking to fight.</text>
<text x='872.0' y='646.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Heslop's first kickback was a short part. Never sand pieces shorter than 12"</text>
<text x='872.0' y='664.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>  unless they are stuck to a carrier with hot-melt or carpet tape.</text>
</svg>
