<rect x='80.0' y='620.0' width='1520.0' height='148.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='92.0' y='642.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>CUTTING</text>
<text x='92.0' y='660.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Hook tape: 4" PSA, wrapped so joints stagger vs the paper. Burnish. No bubbles.</text>
<text x='92.0' y='678.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Paper: 3" roll, 80 / 120 / 150. Cut a parallelogram: long side = 16" / sin(θ), θ ≈ 17°.</text>
<text x='92.0' y='696.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Start in the idle-end bell slot. Keep tension. Tuck the drive end. No lumps.</text>
<text x='92.0' y='714.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Replacement pieces: trace the first wrap. Number the grit on the idle bell with a paint pen.</text>
<text x='92.0' y='732.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• True after every wrap change: carrier board + sanding block until the whole face cuts.</text>
<text x='92.0' y='750.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Loaded paper (paint, pitch, glue) comes off. Do not run hot. Dull paper is a fire.</text>
</svg>
