<text x='912.0' y='882.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>FRAME NOTES</text>
<text x='912.0' y='900.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Glue two ¾" BB skins per wall, grain crossed, clamp on a flat door.</text>
<text x='912.0' y='918.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Drill bearing holes after glue-up; use the steel plate as a drill jig.</text>
<text x='912.0' y='936.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Idle wall: vertical slots + jack screws. Drive wall: round holes, fixed.</text>
<text x='912.0' y='954.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Screw-and-glue stretchers with #8 × 2" and waterproof PVA (Titebond III).</text>
<text x='912.0' y='972.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Do not use MDF for walls or drum. Walters' MDF discs cracked in service.</text>
