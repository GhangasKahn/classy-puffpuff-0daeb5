<text x='52.0' y='540.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Idle/drive walls are doubled, grain crossed. Drum discs come out of sheet 3.</text>
<text x='52.0' y='558.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Buy one extra ¾" if your sheet has a void — voids become vibration.</text>
<text x='52.0' y='576.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Hard maple for base rails and nut blocks. Do not use construction 2× for the Acme nuts.</text>
<rect x='40.0' y='660.0' width='1600.0' height='112.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
