<text x='52.0' y='700.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• MDF for drum or walls.  • A 16×48 sanding belt as a conveyor.  • PVC pipe rollers.</text>
<text x='52.0' y='718.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Pillow blocks on a single ¾" wall with no plate.  • An open-drip motor in this dust.</text>
<text x='52.0' y='736.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• A light switch as the only disconnect.  • Formica for the platen.</text>
<text x='52.0' y='754.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Catalog numbers drift. The search term is the spec. Measure the part in your hand.</text>
