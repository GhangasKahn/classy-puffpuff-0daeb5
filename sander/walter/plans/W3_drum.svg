<text x='1120.0' y='545.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#6b5340' text-anchor='middle'>Bore 0.002" under shaft. Dry-fit. Polyurethane or epoxy.</text>
<text x='40.0' y='690.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#b4532a' text-anchor='start' font-weight='600'>SPIRAL WRAP  —  3" ROLL ON 4" HOOK TAPE  ·  PAPER RETAINERS IN END BELLS</text>
