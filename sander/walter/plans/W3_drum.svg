<text x='410.9' y='126.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='middle'>3/16" SQ KEYWAY × 4.00"</text>
<text x='1149.1' y='126.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='middle'>3/16" SQ KEYWAY × 4.00"</text>
<text x='80.0' y='232.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='start'>Do not use plain cold-rolled as the only shaft. Walters' CRS + piano-wire pins worked, then he wanted better steel.</text>
<text x='80.0' y='252.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='start'>Cross-drill is a last resort. A proper key is removable and does not stress-risers the shaft as badly as a through-pin.</text>
<text x='40.0' y='290.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#b4532a' text-anchor='start' font-weight='600'>DISC STACK  —  21 × ¾" BALTIC BIRCH, Ø 5.125" BLANK, TURNED TO 5.000"</text>
