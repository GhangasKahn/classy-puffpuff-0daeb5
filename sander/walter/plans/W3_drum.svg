<text x='440.0' y='890.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='middle'>Start in idle-end slot. Wrap 15–20°. Tuck drive-end into slot. No tape-on-tape lumps.</text>
<rect x='860.0' y='700.0' width='760.0' height='184.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='872.0' y='722.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>ABRASIVE + TRUING</text>
<text x='872.0' y='740.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• PSA hook tape 4" wide on the turned drum (covers 3" paper gaps).</text>
<text x='872.0' y='758.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Prefer hook-and-loop paper so you are not glued to the drum forever</text>
<text x='872.0' y='776.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>  (Walters: Velcro so sticky that replacing it meant a new drum).</text>
<text x='872.0' y='794.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• End-bell slots let you change paper without destroying the wrap.</text>
<text x='872.0' y='812.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• After wrap, true the drum: lock table, run, feed a sanding block</text>
<text x='872.0' y='830.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>  on a carrier until the whole face cuts evenly.</text>
<text x='872.0' y='848.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Then set idle-end jack screws so a 16" test board kisses both ends.</text>
<text x='872.0' y='866.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Stay off paint and varnish — they load paper instantly.</text>
