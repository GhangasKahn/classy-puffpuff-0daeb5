<text x='374.0' y='652.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='middle'>0.5 mm expansion gap every 4th glue line (Walters: hairline cracks without gaps)</text>
