<circle cx='1252.8' cy='484.8' r='17.3' fill='#f4efe6' stroke='#1c1914' stroke-width='1.2'/>
<text x='1064.8' y='811.6' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='middle'>IDLE PLATE: slot these two holes vertically 0.90"</text>
<text x='1064.8' y='831.6' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='middle'>DRIVE PLATE: round holes, fixed</text>
<rect x='40.0' y='780.0' width='1600.0' height='94.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='52.0' y='802.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>KEY  —  3/16" SQ × 4.00"  (two required, 1045 or 1144)</text>
<text x='52.0' y='820.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Do not use piano wire. File a slight chamfer so it starts in the disc stack.</text>
<text x='52.0' y='838.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Disc bore is 0.002" under shaft: freeze the shaft, warm the discs, or ream the last thou.</text>
<text x='52.0' y='856.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>After the stack is glued, turn the OD to 5.000" between centers or in the machine.</text>
