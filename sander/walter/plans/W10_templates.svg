<text x='175.0' y='1126.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='18' fill='#1c1914' text-anchor='start' font-weight='600'>W-10  ·  1:1 templates — disc, plate, key</text>
<text x='40.0' y='1154.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='start'>Print at 100% on Letter/A4 and check the 1.00" scale bar</text>
<text x='1640.0' y='1130.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#6b5340' text-anchor='end'>16″ closed-frame drum thickness sander</text>
<text x='1640.0' y='1154.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='end'>Original engineering  ·  Rev C  ·  Shop build</text>
<text x='40.0' y='62.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#b4532a' text-anchor='start' font-weight='600'>SCALE CHECK  —  THIS BAR MUST MEASURE 1.00" ON PAPER</text>
<rect x='40.0' y='80.0' width='101.6' height='18.0' fill='#b4532a' stroke='#1c1914' stroke-width='1'/>
<text x='153.6' y='94.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#1c1914' text-anchor='start'>1.00"</text>
<text x='40.0' y='130.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#b4532a' text-anchor='start' font-weight='600'>DRUM DISC  J  —  Ø 5.125" BLANK  ·  BORE 0.748"  ·  3/16" KEYWAY</text>
<circle cx='320.0' cy='430.0' r='260.3' fill='#c4b49a' stroke='#1c1914' stroke-width='2'/>
<circle cx='320.0' cy='430.0' r='38.0' fill='#f4efe6' stroke='#1c1914' stroke-width='1.6'/>
<rect x='310.5' y='381.8' width='19.0' height='14.2' fill='#b4532a' stroke='#1c1914' stroke-width='1'/>
<text x='320.0' y='714.3' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='middle'>21 REQUIRED  ·  bandsaw oversize, sand to line after glue-up</text>
<text x='720.0' y='130.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#b4532a' text-anchor='start' font-weight='600'>BEARING PLATE  —  ¼" STEEL  6.00 × 6.00</text>
<rect x='760.0' y='180.0' width='609.6' height='609.6' fill='#5c656c' stroke='#1c1914' stroke-width='2'/>
