<rect x='24.0' y='24.0' width='1632.0' height='1140.0' fill='none' stroke='#1c1914' stroke-width='1.2'/>
<line x1='24.0' y1='1098.0' x2='1656.0' y2='1098.0' stroke='#1c1914' stroke-width='1.5'/>
<text x='40.0' y='1130.0' font-family='Georgia, serif' font-size='28' fill='#b4532a' text-anchor='start' font-weight='600'>WALTER</text>
<text x='175.0' y='1126.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='18' fill='#1c1914' text-anchor='start' font-weight='600'>W-4  ·  Table elevation</text>
<text x='40.0' y='1154.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='start'>Dual ¾-6 Acme  ·  0.167" per rev  ·  4.50" travel</text>
<text x='1640.0' y='1130.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='14' fill='#6b5340' text-anchor='end'>16″ closed-frame drum thickness sander</text>
<text x='1640.0' y='1154.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='end'>Original engineering  ·  Rev A  ·  Shop build</text>
<text x='40.0' y='62.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#b4532a' text-anchor='start' font-weight='600'>ELEVATION SCHEME  —  REPLACE THE OAK DOWEL</text>
<text x='40.0' y='82.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='start'>Walters cut threads in a 2×4 with a wood tap. It worked. It also wears, swells, and has no sync.</text>
<rect x='80.0' y='420.0' width='720.0' height='360.0' fill='none' stroke='#d4cbb8' stroke-width='1.5' stroke-dasharray='6 4'/>
<rect x='190.0' y='560.0' width='500.0' height='20.0' fill='#e8eef0' stroke='#1c1914' stroke-width='1.6'/>
<text x='440.0' y='572.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#6b5340' text-anchor='middle'>PLATEN  ¾" BB + ⅛" HDPE/PHENOLIC</text>
<rect x='273.0' y='500.0' width='14.0' height='240.0' fill='#5c656c' stroke='#1c1914' stroke-width='1.4'/>
<rect x='262.0' y='560.0' width='36.0' height='18.0' fill='#b4532a' stroke='#1c1914' stroke-width='1.2'/>
<text x='280.0' y='676.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#b4532a' text-anchor='middle'>¾-6 ACME</text>
<rect x='593.0' y='500.0' width='14.0' height='240.0' fill='#5c656c' stroke='#1c1914' stroke-width='1.4'/>
<rect x='582.0' y='560.0' width='36.0' height='18.0' fill='#b4532a' stroke='#1c1914' stroke-width='1.2'/>
<text x='600.0' y='676.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#b4532a' text-anchor='middle'>¾-6 ACME</text>
<line x1='280.0' y1='712.0' x2='600.0' y2='712.0' stroke='#2a2a2c' stroke-width='3'/>
<circle cx='280.0' cy='712.0' r='16.0' fill='#5c656c' stroke='#1c1914' stroke-width='1.2'/>
<circle cx='600.0' cy='712.0' r='16.0' fill='#5c656c' stroke='#1c1914' stroke-width='1.2'/>
<text x='440.0' y='732.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#6b5340' text-anchor='middle'>5 mm HTD BELT  OR  #25 CHAIN  —  KEEPS SCREWS IN TIME</text>
<circle cx='164.0' cy='712.0' r='36.0' fill='#f4efe6' stroke='#1c1914' stroke-width='2'/>
<circle cx='164.0' cy='712.0' r='8.0' fill='#5c656c' stroke='#1c1914' stroke-width='1'/>
<text x='164.0' y='756.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#1c1914' text-anchor='middle'>4" HANDWHEEL</text>
<rect x='200.0' y='524.0' width='480.0' height='8.0' fill='#cfd8dc' stroke='#1c1914' stroke-width='1'/>
<text x='440.0' y='512.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#6b5340' text-anchor='middle'>UHMW WAYS IN DADOS (BOTH WALLS)</text>
<circle cx='240.0' cy='536.0' r='10.0' fill='#b4532a' stroke='#1c1914' stroke-width='1'/>
<circle cx='640.0' cy='536.0' r='10.0' fill='#b4532a' stroke='#1c1914' stroke-width='1'/>
<text x='240.0' y='522.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='10' fill='#b4532a' text-anchor='middle'>LOCK</text>
<line x1='280.0' y1='500.0' x2='280.0' y2='468.0' stroke='#6b5340' stroke-width='1'/>
<line x1='600.0' y1='500.0' x2='600.0' y2='468.0' stroke='#6b5340' stroke-width='1'/>
<line x1='280.0' y1='476.0' x2='600.0' y2='476.0' stroke='#6b5340' stroke-width='1.4'/>
<polygon points='280.0,476.0 290.0,472.0 290.0,480.0' fill='#6b5340' stroke='#6b5340' stroke-width='0.5'/>
<polygon points='600.0,476.0 590.0,472.0 590.0,480.0' fill='#6b5340' stroke='#6b5340' stroke-width='0.5'/>
<rect x='349.0' y='455.0' width='182.0' height='21.0' fill='#f4efe6'/>
<text x='440.0' y='470.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#6b5340' text-anchor='middle'>16.00" screw spacing</text>
<line x1='800.0' y1='560.0' x2='828.0' y2='560.0' stroke='#6b5340' stroke-width='1'/>
<line x1='800.0' y1='650.0' x2='828.0' y2='650.0' stroke='#6b5340' stroke-width='1'/>
<line x1='820.0' y1='560.0' x2='820.0' y2='650.0' stroke='#6b5340' stroke-width='1.4'/>
<polygon points='820.0,560.0 816.0,570.0 824.0,570.0' fill='#6b5340' stroke='#6b5340' stroke-width='0.5'/>
<polygon points='820.0,650.0 816.0,640.0 824.0,640.0' fill='#6b5340' stroke='#6b5340' stroke-width='0.5'/>
<text x='832.0' y='610.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#6b5340' text-anchor='start' transform='rotate(-90 832.0 610.0)'>4.50" travel</text>
<text x='900.0' y='62.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#b4532a' text-anchor='start' font-weight='600'>NUT BLOCK  (each screw)</text>
<rect x='940.0' y='100.0' width='220.0' height='160.0' fill='#d4cbb8' stroke='#1c1914' stroke-width='1.6'/>
<rect x='1020.0' y='90.0' width='60.0' height='180.0' fill='#5c656c' stroke='#1c1914' stroke-width='1.4'/>
<rect x='1005.0' y='155.0' width='90.0' height='50.0' fill='#b4532a' stroke='#1c1914' stroke-width='1.2'/>
<text x='1050.0' y='185.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='11' fill='#f4efe6' text-anchor='middle' font-weight='600'>BRONZE</text>
<text x='1050.0' y='290.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#6b5340' text-anchor='middle'>2×2×3" hardwood + ¾-6 ACME nut</text>
<text x='1050.0' y='310.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#6b5340' text-anchor='middle'>McMaster 6350K15 or equivalent</text>
<text x='900.0' y='350.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='15' fill='#b4532a' text-anchor='start' font-weight='600'>RESOLUTION</text>
<text x='920.0' y='380.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>ACME</text>
<text x='1040.0' y='380.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>¾-6  →  0.1667" per revolution</text>
<text x='920.0' y='408.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>FINE FEEL</text>
<text x='1040.0' y='408.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>¼ turn = 0.042"  ·  1/16 turn ≈ 0.010"</text>
<text x='920.0' y='436.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>READOUT</text>
<text x='1040.0' y='436.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>6" digital caliper glued to idle wall, probe on platen</text>
<text x='920.0' y='464.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>OR</text>
<text x='1040.0' y='464.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>0.001" dial indicator on a magnetic base</text>
<text x='920.0' y='492.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>LOCK</text>
<text x='1040.0' y='492.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>two 5/16-18 star knobs clamp the rails after setting</text>
<text x='920.0' y='520.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>CHECK</text>
<text x='1040.0' y='520.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>16" straightedge + feeler gauges, both ends of drum</text>
<text x='920.0' y='548.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>DRIFT</text>
<text x='1040.0' y='548.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>if one screw leads, skip a tooth on the HTD and retime</text>
<rect x='900.0' y='600.0' width='720.0' height='130.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='912.0' y='622.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>WHY NOT FOUR CORNER SCREWS</text>
<text x='912.0' y='640.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Four independent screws will rack the platen. Two, mechanically timed,</text>
<text x='912.0' y='658.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>  plus stiff torsion-box platen, is how mills and commercial sanders do it.</text>
<text x='912.0' y='676.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Drum parallelism is a separate adjustment (idle bearing jack, sheet W-3/W-2).</text>
<text x='912.0' y='694.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>  Do not use table tilt to fake a tapered drum — that sands a wedge.</text>
<text x='912.0' y='712.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Optional: one screw + linear rails + a long torsion box. Dual is more forgiving.</text>
<rect x='40.0' y='860.0' width='800.0' height='94.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='52.0' y='882.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>PLATEN  —  NOT FORMICA</text>
<text x='52.0' y='900.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Walters' Formica top scored immediately. Use ⅛" HDPE, UHMW, or phenolic on ¾" BB.</text>
<text x='52.0' y='918.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• Face must be dead flat under the drum: torsion-box the platen (¼" skins, ¾" grid).</text>
<text x='52.0' y='936.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>• A 0.010" hump under the drum prints as a stripe on every board.</text>
</svg>
