<rect x='80.0' y='400.0' width='720.0' height='130.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='92.0' y='422.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>F-002 IDLE WALL  ·  F-003 DRIVE WALL</text>
<text x='92.0' y='440.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Each wall = two ¾″ Baltic birch skins, grain crossed, PVA, cauls on a flat door.</text>
<text x='92.0' y='458.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Finished 20.00 × 36.00 × 1.50. Inner faces are datums for dados and plates.</text>
<text x='92.0' y='476.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Idle wall: slot two plate holes 0.90″ vertical for jack travel (J-202).</text>
<text x='92.0' y='494.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Drive wall: round holes, plate fixed. Do not slot both — the machine will rack.</text>
<text x='92.0' y='512.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Reject pith, voids at the plate, and skins that do not glue flat.</text>
<rect x='840.0' y='140.0' width='520.0' height='112.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='852.0' y='162.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>JOINERY J-WALL</text>
<text x='852.0' y='180.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Glue on a known-flat door. Winding sticks after cure.</text>
<text x='852.0' y='198.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Stretchers F-004/005 at infeed and outfeed, 16.50 × 3.50 × 0.75.</text>
<text x='852.0' y='216.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Base F-001 22.00 × 36.00 × 0.75 sits under walls (D1).</text>
<text x='852.0' y='234.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Maple rails F-006/007 under the base, 33 × 1.50 × 1.50.</text>
