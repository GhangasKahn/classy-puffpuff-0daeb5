<text x='92.0' y='602.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>This is a state diagram for the builder and the electrician, not a wiring schedule for a permit.</text>
<text x='92.0' y='620.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Typical 1 HP 115 V FLA is often ~13 A — that sentence is [E], not a heater catalog number. Read the nameplate.</text>
<text x='92.0' y='638.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>AI / this HTML book is not a protective measure. Interlocks and NOVR are electromechanical.</text>
<text x='92.0' y='656.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>See W-12. Q06 is a hold point. SAFE-001 remains OPEN until the electrician and blink test close it.</text>
