<text x='92.0' y='582.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>ST-001 IDLE — SLOT the two 5/16 holes 0.90″ vertically. UCFL204 rides the jack.</text>
<text x='92.0' y='600.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>ST-002 DRIVE — round holes, no slots. This plate is the fixed end of D2.</text>
<text x='92.0' y='618.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Material A36 ¼″. Deburr. Use the plate as the drill jig on the birch wall.</text>
<text x='92.0' y='636.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Print T-PLATE.svg at 100%. Check both calibration bars before transferring.</text>
