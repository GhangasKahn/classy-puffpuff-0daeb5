<text x='92.0' y='462.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>J-WAY: 0.50 × 2.00 ways in wall dados. Sliding 0.02–0.04. Oil. Never paint sliding faces.</text>
<text x='92.0' y='480.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>J-ACME: clock both bronze nuts (datum D4) before the HTD 5 mm belt. Witness paint.</text>
<text x='92.0' y='498.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Four independent screws will rack — Walters' oak dowel was one; four corners are worse.</text>
<text x='92.0' y='516.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Idle jack: mid-slot = D3 zero = plates coplanar. True the drum, then jack for parallelism.</text>
<text x='92.0' y='534.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Lock knobs on the ways before any cut. DRO is a readout, not a clamp.</text>
</svg>
