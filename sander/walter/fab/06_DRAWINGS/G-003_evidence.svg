<text x='60.0' y='580.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>CAL-001 drum_rpm [D] = 1725 × 3.00 / 4.75 = 1089.47 r/min</text>
