<text x='60.0' y='640.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Bag 1: column clamps, overnight PVA. Bag 2: cauls on a door, then box clamps on D1.</text>
<text x='60.0' y='658.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Bag 3: platen skins under even cauls. Ways mechanical. Do not glue UHMW across the whole face if you want to replace it.</text>
<text x='60.0' y='676.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Hold points: keyway dry; drive plate not slotted; Acme clocked; 115 V not live; Q06 before Q09.</text>
