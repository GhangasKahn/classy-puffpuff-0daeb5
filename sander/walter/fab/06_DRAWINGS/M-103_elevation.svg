<text x='92.0' y='600.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Datum D4: clock both bronze nuts together, paint a witness, THEN fit the HTD belt.</text>
<text x='92.0' y='618.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Four independent corner screws will rack the platen (Walters-adjacent failure). Two screws, one crank.</text>
<text x='92.0' y='636.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Ways T-003/004 slide 0.02–0.04 in wall dados. Oil. Never paint. See J-202 / P-211.</text>
<text x='92.0' y='654.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Q05: witness marks still aligned after a full up/down. Q10: jack at D3 zero before trusting taper.</text>
