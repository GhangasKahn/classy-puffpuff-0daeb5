<text x='234.0' y='544.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#6b5340' text-anchor='middle'>MAX 4.00  (phantom)</text>
<rect x='720.0' y='120.0' width='720.0' height='148.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='732.0' y='142.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>HUMAN / NIP / EJECTION</text>
<text x='732.0' y='160.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Operator stands at infeed (Y = 0). Drum bottom rotates toward operator.</text>
<text x='732.0' y='178.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Nip 1: drum-to-work. Nip 2: conveyor rollers. Nip 3: 4L belt outboard — M-003 covers it.</text>
<text x='732.0' y='196.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Ejection: short stock back toward infeed. 12″ minimum or carrier (F06).</text>
<text x='732.0' y='214.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Reach: elevation handwheel at infeed-left. E-stop at drive-side, not behind the belt.</text>
<text x='732.0' y='232.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Opening default 1.50 [A] for drawings. DRO reads from a wall-mounted caliper.</text>
<text x='732.0' y='250.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>A-105 N/A — no floor anchors. Optional N-001 stand is a cabinet, not a foundation.</text>
</svg>
