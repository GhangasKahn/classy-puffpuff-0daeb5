<rect x='80.0' y='380.0' width='900.0' height='112.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='92.0' y='402.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>PSA hook tape on the turned OD. 3″ roll, 80 / 120 / 150.</text>
<text x='92.0' y='420.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Start the paper in the idle-end retainer slot; finish in the drive-end slot.</text>
<text x='92.0' y='438.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Trace the first wrap. No lumps, no gaps that print as stripes.</text>
<text x='92.0' y='456.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Walters' Velcro was permanent — a new drum to change paper. Slots make wrap a wear part.</text>
<text x='92.0' y='474.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>True on a carrier board until the whole 16″ face cuts (Q09).</text>
