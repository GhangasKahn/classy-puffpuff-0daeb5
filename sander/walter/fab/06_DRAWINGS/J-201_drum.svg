<text x='180.0' y='294.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='12' fill='#b4532a' text-anchor='start' font-weight='600'>KEY 3/16 × 4.00  ST-005</text>
<text x='80.0' y='400.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>0.5 mm GAP EVERY 4 DISCS  ·  NO GLUE IN KEYWAY</text>
<rect x='80.0' y='460.0' width='780.0' height='148.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='92.0' y='482.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>SEQUENCE</text>
<text x='92.0' y='500.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>1. Number discs 1–21. Dry-stack. Confirm 16.00 face after bells.</text>
<text x='92.0' y='518.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>2. PVA on faces only. Clamp as a column. Wipe the keyway.</text>
<text x='92.0' y='536.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>3. End bells ST-006, retainer slots at idle and drive.</text>
<text x='92.0' y='554.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>4. True OD to 5.000 ±0.010 (Q02) between centers or in-machine on a carrier.</text>
<text x='92.0' y='572.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>FAILURE: glue in the keyway locks the stack to the shaft forever.</text>
<text x='92.0' y='590.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>FAILURE: no gaps + MDF = hairline cracks (Walters). Birch + 0.5 mm.</text>
<rect x='900.0' y='120.0' width='480.0' height='112.0' fill='#efe8dc' stroke='#6b5340' stroke-width='1'/>
<text x='912.0' y='142.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>FIT</text>
<text x='912.0' y='160.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Bore 0.748 on Ø0.750 shaft = 0.002 under.</text>
<text x='912.0' y='178.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Freeze shaft or warm discs, or ream one disc.</text>
<text x='912.0' y='196.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Key is removable 1045/1144 — not piano wire.</text>
<text x='912.0' y='214.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Inspection: Q02 + no rock on the key.</text>
</svg>
