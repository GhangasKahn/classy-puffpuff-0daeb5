<text x='92.0' y='720.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>4L440 link [S] 6191K37 and 4.75 pulley [S] 6245K47 — still verify live catalog.</text>
<text x='92.0' y='738.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Gravity motor-on-dowel went slack on startup (Walters). Hinge + turnbuckle is the fix.</text>
<text x='92.0' y='756.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Guard fully enclosed. No finger slot at the pinch. Magnetic starter + mushroom E-stop.</text>
<text x='92.0' y='774.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>W-12 is design intent, not NEC. Electrician sizes OL heaters to FLA [P].</text>
<text x='92.0' y='792.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Q06: restore power after E-stop — drum must not auto-restart.</text>
