<text x='92.0' y='462.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>Feed at 30 rpm roller [D] = π × 2.00 / 12 × 30 = 15.71 FPM. PWM 0–16 FPM target.</text>
<text x='92.0' y='480.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>24 V worm gearmotor on the outfeed shaft. Isolated from 115 V drum circuit.</text>
<text x='92.0' y='498.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Belt 16.00 × 60.00 2-ply PVC endless — specify conveyor belting, not abrasive.</text>
<text x='92.0' y='516.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Workpiece must be ≥12″ or on a carrier. Short stock is a projectile (F06).</text>
<text x='92.0' y='534.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Rotation: drum bottom toward infeed (against feed); dust into the back hood.</text>
