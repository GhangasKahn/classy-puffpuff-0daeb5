<text x='92.0' y='502.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>Walters used a 16×48 sanding belt on PVC pipe. It never tracked (three rebuilds).</text>
<text x='92.0' y='520.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Turn a barrel on aluminum tube 2.00 OD × 16.25. Flat rollers do not self-center.</text>
<text x='92.0' y='538.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Idle-end ¼-20 skew. Belt 1/32 above the UHMW. Track empty 60 s, then loaded (Q04).</text>
<text x='92.0' y='556.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Option B if tracking fails: HDPE sliding table — see W-5. Do not return to a sanding belt.</text>
<text x='92.0' y='574.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Roller CD 26.86 [D]. Shafts ⅝″ in UCFL201-10.</text>
