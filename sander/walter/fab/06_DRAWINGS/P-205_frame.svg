<text x='60.0' y='542.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>F-001 sits on maple rails F-006/007. Walls sit on F-001 (datum D1). Stretchers F-004/005 at infeed and outfeed.</text>
<text x='60.0' y='560.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Grain on F-001 along Y (depth). Stretchers grain along X. Rails grain along Y.</text>
<text x='60.0' y='578.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Do not let a stretcher lift a wall off D1. Dry-fit diagonals before glue.</text>
