<text x='72.0' y='662.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#b4532a' text-anchor='start' font-weight='600'>¼″ sheet: platen skins T-001, hood HD-001, guard M-003. Maple: rails F-006/007, nut blocks T-005, ways.</text>
<text x='72.0' y='680.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Kerf + trim: leave 1/8 on plywood lengths. Rest overnight after breaking down, then mill to finished.</text>
<text x='72.0' y='698.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>Do not nest a disc on a void. One machining error on D-001 is cheaper than a second 5×5 if you kept a spare.</text>
<text x='72.0' y='716.0' font-family='IBM Plex Mono, Menlo, monospace' font-size='13' fill='#1c1914' text-anchor='start'>N-001 stand is optional — sheet 4 if you build it. See W-11.</text>
