<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161310">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hearth">
  <meta name="format-detection" content="telephone=no">
  <title>Hearth</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login" class="login">
    <p class="eyebrow">Erie County kitchen</p>
    <h1>Hearth</h1>
    <p class="lede">This phone keeps the list. Nothing is sent to a server.</p>
    <p id="login-error" class="error" hidden></p>
    <label for="person">Who is holding the phone</label>
    <select id="person"></select>
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12">
    <button type="button" id="open-btn" class="solid">Open kitchen</button>
    <p class="hint">First open PIN is 4829. Change it after you get in. Android: browser menu → Add to Home screen. iPhone: Share → Add to Home Screen.</p>
  </div>

  <div id="app" hidden>
    <header class="top">
      <p id="who" class="who">Hearth</p>
      <button type="button" id="mic-top" class="icon-btn" aria-label="Talk">Talk</button>
      <button type="button" id="lock-btn" class="text-btn">Lock</button>
    </header>
    <main id="view" class="view"></main>
    <p id="toast" class="toast" hidden></p>
    <nav class="tabs" aria-label="Kitchen">
      <button type="button" data-tab="home">Home</button>
      <button type="button" data-tab="rooms">Rooms</button>
      <button type="button" data-tab="shop">Shop</button>
      <button type="button" data-tab="cook">Cook</button>
      <button type="button" data-tab="money">Money</button>
    </nav>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
