# BEDROCK — Netlify configuration
[build]
  publish = "."
  command = ""

# service worker must never be cached stale, and must serve as JS
[[headers]]
  for = "/app/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/app/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# MARTIN build app PWA
[[headers]]
  for = "/fence/martin/app/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/fence/martin/app/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"


# sensible security headers (no strict CSP: the app loads CDN + fonts + inline)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # geolocation allowed on same origin for the Aegis Air "use my location" feature
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"

[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301

# /aegis now serves the cinematic landing page (committed build in /aegis/),
# whose CTAs funnel into the instrument app at /aegis-air-mvp/.

[[redirects]]
  from = "/aegis-air-mvp"
  to = "/aegis-air-mvp/"
  status = 301

[[redirects]]
  from = "/command"
  to = "/aegis-command/"
  status = 301

[[redirects]]
  from = "/aegis-command"
  to = "/aegis-command/"
  status = 301

# ---- fence design suite (MARTIN / HASHIRA / STELE / report) ----
[[redirects]]
  from = "/fence"
  to = "/fence/"
  status = 301

[[redirects]]
  from = "/martin"
  to = "/fence/martin/"
  status = 301

[[redirects]]
  from = "/martin/app"
  to = "/fence/martin/app/"
  status = 301

[[redirects]]
  from = "/build"
  to = "/fence/martin/app/"
  status = 301

[[redirects]]
  from = "/stele"
  to = "/fence/stele/"
  status = 301

[[redirects]]
  from = "/report"
  to = "/fence/report/"
  status = 301

# ---- shop machine suite (WALTER drum sander) ----
[[redirects]]
  from = "/sander"
  to = "/sander/"
  status = 301

[[redirects]]
  from = "/walter"
  to = "/sander/walter/"
  status = 301

[[redirects]]
  from = "/walter/immersive"
  to = "/sander/walter/app/immersive.html"
  status = 301

[[redirects]]
  from = "/walter/report"
  to = "/sander/walter/report/"
  status = 301

[[redirects]]
  from = "/walter/manual"
  to = "/sander/walter/manual/"
  status = 301

[[redirects]]
  from = "/walter/guide"
  to = "/sander/walter/guide/"
  status = 301

[[redirects]]
  from = "/walter/planforge"
  to = "/sander/walter/planforge/"
  status = 301

[[redirects]]
  from = "/walter/fab"
  to = "/sander/walter/fab/"
  status = 301

[[headers]]
  for = "/sander/walter/app/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/sander/walter/app/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# CAD downloads: force download with correct types
[[headers]]
  for = "/fence/*/exports/*"
  [headers.values]
    Content-Disposition = "attachment"

[[headers]]
  for = "/*.FCStd"
  [headers.values]
    Content-Type = "application/zip"
    Content-Disposition = "attachment"

[[headers]]
  for = "/*.step"
  [headers.values]
    Content-Type = "application/step"
    Content-Disposition = "attachment"

[[headers]]
  for = "/*.stl"
  [headers.values]
    Content-Type = "model/stl"

[[headers]]
  for = "/*.scad"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# plan sheets render inline as SVG
[[headers]]
  for = "/fence/stele/plans/*"
  [headers.values]
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/fence/martin/plans/*"
  [headers.values]
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/sander/*/plans/*"
  [headers.values]
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/sander/walter/manual/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/sander/walter/fab/06_DRAWINGS/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/sander/walter/fab/10_TEMPLATES/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/sander/*/exports/*"
  [headers.values]
    Content-Disposition = "attachment"
